<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Report de réservations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
/* Layout : chrome sombre type CAO autour d'une scène fixe, panneaux latéraux en colonnes, inspecteur en pied de panneau */
:root{
  --bg:#eceff3; --panel:#ffffff; --panel-2:#f5f7fa; --ink:#161a21; --muted:#5d6675;
  --line:#d6dbe3; --line-soft:#e6eaf0;
  --accent:#c8492a; --accent-soft:rgba(200,73,42,.12);
  --blue:#1f6f8b; --blue-soft:rgba(31,111,139,.14);
  --ok:#2d7a4f; --warn:#9d7312;
  --stage:#20252d; --stage-grid:rgba(255,255,255,.07);
  --f-ui:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-num:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13161b; --panel:#1b1f26; --panel-2:#21262e; --ink:#e7eaf0; --muted:#98a1b0;
  --line:#2c323c; --line-soft:#242931;
  --accent:#ef7047; --accent-soft:rgba(239,112,71,.16);
  --blue:#56b2cf; --blue-soft:rgba(86,178,207,.16);
  --ok:#5cb281; --warn:#d6a53c;
  --stage:#101317; --stage-grid:rgba(255,255,255,.06);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13161b; --panel:#1b1f26; --panel-2:#21262e; --ink:#e7eaf0; --muted:#98a1b0;
  --line:#2c323c; --line-soft:#242931;
  --accent:#ef7047; --accent-soft:rgba(239,112,71,.16);
  --blue:#56b2cf; --blue-soft:rgba(86,178,207,.16);
  --ok:#5cb281; --warn:#d6a53c;
  --stage:#101317; --stage-grid:rgba(255,255,255,.06);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

#app{
  height:100%;display:grid;grid-template-columns:272px minmax(0,1fr) 292px;gap:10px;
  padding-left:max(10px,env(safe-area-inset-left,0px));
  padding-right:max(10px,env(safe-area-inset-right,0px));
  padding-block:10px;
}

/* ---------- panneau ---------- */
.side{min-width:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0}
.card > header{display:flex;align-items:center;gap:5px;padding:8px 8px 8px 11px;border-bottom:1px solid var(--line-soft)}
.card > header h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card > header .sp{margin-left:auto}
.scroll{overflow:auto;min-height:0}

.brand{display:flex;align-items:baseline;gap:9px;padding:2px 2px 0}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand span{font-family:var(--f-num);font-size:10px;color:var(--muted);letter-spacing:.06em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:6px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:5px 7px}
.btn.ghost:hover{color:var(--ink);background:var(--panel-2)}
.btn.sm{padding:3px 7px;font-size:11.5px}
.btn[disabled]{opacity:.42;pointer-events:none}

/* ---------- niveaux ---------- */
.lvl{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:9px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.lvl:last-child{border-bottom:0}
.lvl:hover{background:var(--panel-2)}
.lvl.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.lvl .th{width:34px;height:26px;border:1px solid var(--line);border-radius:3px;background:#fff center/contain no-repeat;flex:none}
.lvl .nm{min-width:0}
.lvl .nm input{width:100%;background:transparent;border:0;padding:0;font-size:13px;font-weight:600;letter-spacing:-.005em}
.lvl .nm input:focus{outline:0;border-bottom:1px solid var(--blue)}
.lvl .meta{font-family:var(--f-num);font-size:10px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center}
.tag{font-family:var(--f-num);font-size:9.5px;letter-spacing:.04em;padding:1px 5px;border-radius:3px;text-transform:uppercase}
.tag.warn{background:var(--accent-soft);color:var(--accent)}
.tag.ok{color:var(--ok);background:transparent;padding-left:0}
.ord{display:flex;flex-direction:column;gap:1px}
.ord button{border:0;background:transparent;color:var(--muted);line-height:1;padding:1px 3px;font-size:10px;border-radius:3px}
.ord button:hover{color:var(--ink);background:var(--panel-2)}

/* ---------- réservations ---------- */
.res{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:9px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.res:last-child{border-bottom:0}
.res:hover{background:var(--panel-2)}
.res.on{background:var(--blue-soft);box-shadow:inset 3px 0 0 var(--blue)}
.swatch{width:10px;height:10px;border-radius:2px}
.res .nm{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .dim{font-family:var(--f-num);font-size:10.5px;color:var(--muted)}
.bad{font-family:var(--f-num);font-size:9.5px;color:#fff;background:#d8352a;border-radius:3px;padding:1px 4px;vertical-align:1px}
.st{display:flex;gap:4px}
.st button{flex:1;border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:4px;font-size:12px;color:var(--muted)}
.st button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.st button.ko{background:#d8352a;border-color:#d8352a;color:#fff}

.empty{padding:14px 12px;color:var(--muted);font-size:12.5px;line-height:1.5}

/* ---------- calques ---------- */
.ly{display:grid;grid-template-columns:18px 22px 14px minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:5px 6px;border-bottom:1px solid var(--line-soft);background:var(--panel-2);cursor:pointer}
.ly.on{box-shadow:inset 3px 0 0 var(--accent)}
.ly .chev,.ly .eye{border:0;background:transparent;color:var(--muted);padding:0;height:22px;display:grid;place-items:center;border-radius:4px;font-size:10px}
.ly .chev:hover,.ly .eye:hover{color:var(--ink);background:var(--line-soft)}
.ly .lsw{width:14px;height:14px;border-radius:3px;position:relative;overflow:hidden;cursor:pointer}
.ly .lsw input{position:absolute;inset:-4px;width:24px;height:24px;opacity:0;cursor:pointer;border:0;padding:0}
.ly .lnm{width:100%;min-width:0;background:transparent;border:0;padding:0;font-size:12.5px;font-weight:600}
.ly .lnm:focus{outline:0;border-bottom:1px solid var(--blue)}
.ly .cnt{font-family:var(--f-num);font-size:10px;color:var(--muted);display:flex;gap:5px;align-items:center}
.ly.off .lnm,.ly.off .lsw,.ly.off .cnt{opacity:.45}
.ly .act{display:none}
.ly.on .act{display:inline}
/* objets : même rangée que les calques, colonnes différentes */
.ob{grid-template-columns:18px 14px 44px minmax(0,1fr) auto auto auto}
.ob.on{background:var(--accent-soft)}
.ob .code{width:100%;min-width:0;background:transparent;border:0;padding:0;font-family:var(--f-num);font-size:12.5px;font-weight:600}
.ob .code:focus{outline:0;border-bottom:1px solid var(--blue)}
.ob .lbl{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob.on [data-go]{background:var(--accent);border-color:var(--accent);color:#fff}
.obed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:8px 10px 9px 30px;border-bottom:1px solid var(--line-soft)}
.obed .full{grid-column:1/-1}
.card header .seg{padding:2px;gap:2px}
.card header .seg button{flex:none;padding:3px 8px;font-size:11.5px}
.inh{margin:0;font-size:11.5px;color:var(--blue);line-height:1.4}
.res.sub{padding-left:30px}
.res.hide{opacity:.45}
.res.none{cursor:default;color:var(--muted);font-size:11.5px;font-style:italic}

/* ---------- panneaux ---------- */
#cardLv{flex:0 1 auto;max-height:45%}
#cardLy{flex:1 1 auto;min-height:140px}
#cardPr{flex:0 1 auto;max-height:100%}
#insp{min-height:0;overflow:auto}
.panes .tool.on{background:rgba(255,255,255,.18);color:#fff}

/* ---------- inspecteur ---------- */
.insp{padding:10px 11px;display:flex;flex-direction:column;gap:9px}
.insp .acts{display:flex;gap:6px;position:sticky;top:0;margin:-10px -11px 0;padding:8px 11px;background:var(--panel);z-index:1;border-bottom:1px solid var(--line-soft)}
.insp .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-family:var(--f-num);font-size:12.5px;font-variant-numeric:tabular-nums}
.fld input[type=text]{font-family:var(--f-ui);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--muted)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.qk{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.qk button{border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:3px 7px;font-size:11px;color:var(--muted)}
.qk button:hover{color:var(--ink);border-color:var(--muted)}
.seg{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:4px;padding:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--blue);color:#fff}
.sheet .row{display:grid;gap:7px}

/* ---------- scène ---------- */
.stage{position:relative;min-width:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--stage)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:5px;padding:8px;flex-wrap:wrap;
  background:linear-gradient(var(--stage),rgba(0,0,0,0));pointer-events:none}
.bar > *{pointer-events:auto}
.tools{display:flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:2px;gap:2px;backdrop-filter:blur(6px)}
.tool{border:0;background:transparent;color:#cfd6e0;border-radius:4px;padding:5px 9px;font-size:12.5px;font-weight:500}
.tool:hover{background:rgba(255,255,255,.1);color:#fff}
.tool.on{background:var(--accent);color:#fff}
.pill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:4px 9px;color:#cfd6e0;font-size:12px;backdrop-filter:blur(6px)}
.pill select{background:transparent;border:0;color:#cfd6e0;font-size:12px;max-width:120px}
.pill select option{color:var(--ink);background:var(--panel)}
.pill input[type=range]{width:74px;accent-color:var(--accent)}
.status{position:absolute;left:0;right:0;bottom:0;display:flex;gap:14px;flex-wrap:wrap;padding:7px 10px;
  font-family:var(--f-num);font-size:10.5px;color:#9aa5b4;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55));font-variant-numeric:tabular-nums;pointer-events:none}
.status b{color:#e7ecf3;font-weight:500}

.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 28px));
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:15px;box-shadow:0 18px 50px rgba(0,0,0,.4);z-index:5}
.sheet h3{margin:0 0 5px;font-size:14.5px}
.sheet p{margin:0 0 11px;color:var(--muted);font-size:12.5px;line-height:1.5}
.sheet .acts{display:flex;gap:7px;justify-content:flex-end;margin-top:12px}
.sheet textarea{width:100%;height:120px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:7px;font-family:var(--f-num);font-size:11px;resize:vertical}

.hint{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:var(--accent);color:#fff;
  padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:4;max-width:90%;text-align:center}

.drop{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:9px;text-align:center;padding:24px;color:#aab3c0}
.drop h3{margin:0;color:#eef1f5;font-size:19px;font-weight:600;letter-spacing:-.01em}
.drop p{margin:0;max-width:40ch;line-height:1.55;font-size:13px}
.drop .acts{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;justify-content:center}
.steps{display:grid;gap:5px;margin-top:10px;text-align:left;font-family:var(--f-num);font-size:11.5px;color:#8d97a4}
.steps span b{color:#c8d1dc;font-weight:500}

.dock{position:absolute;left:10px;bottom:34px;width:272px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:11px;box-shadow:0 14px 36px rgba(0,0,0,.35);z-index:6;display:flex;flex-direction:column;gap:8px}
.dock .dh{display:flex;align-items:center;gap:6px}
.dock .dh b{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .dp{margin:0;font-family:var(--f-num);font-size:11px;color:var(--muted);line-height:1.45}
.dock .row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dock .ck{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--muted);margin-top:7px}
.dock #pL,.dock #pR{display:flex;flex-direction:column;gap:7px}
@media (max-width:900px){.dock{left:10px;right:10px;width:auto}}
.tabs{display:none}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(240px,1fr) auto auto;height:100%}
  .stage{grid-row:1}
  .tabs{grid-row:2;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px}
  .tabs button{flex:1;border:0;background:transparent;border-radius:5px;padding:6px;font-size:12.5px;color:var(--muted);font-weight:500}
  .tabs button.on{background:var(--accent);color:#fff}
  .side{grid-row:3;max-height:42vh}
  .brand,.panes,[data-hide]{display:none!important}
  #tools{max-width:100%;overflow-x:auto;scrollbar-width:none}
  #tools .tool{flex:none}
}
</style>

</head>
<body>
<div id="app">
  <aside class="side" id="sideL">
    <div class="brand"><b>Report de réservations</b><span>NIVEAU → NIVEAU</span></div>

    <section class="card" id="cardLv">
      <header>
        <h2>Niveaux</h2>
        <button class="btn ghost sm" id="ordBtn" title="Sens de rangement de la liste"></button>
        <span class="sp"></span>
        <button class="btn sm" id="addBtn">+ Importer</button>
        <button class="btn ghost sm" data-hide="lv" title="Masquer le panneau">–</button>
      </header>
      <div class="scroll" id="lvList"></div>
    </section>

    <section class="card" id="cardLy">
      <header>
        <div class="seg" id="lstSeg"><button data-v="ly" class="on">Calques</button><button data-v="ob">Objets</button></div>
        <span class="sp"></span>
        <button class="btn sm" id="addLy" title="Nouveau calque">+</button>
        <button class="btn ghost sm" id="jsonBtn" title="Sauvegarde / restauration">⇄</button>
        <button class="btn ghost sm" data-hide="ly" title="Masquer le panneau">–</button>
      </header>
      <div class="scroll" id="rsList"></div>
      <div class="scroll" id="obList" hidden></div>
    </section>
  </aside>

  <section class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="bar">
      <div class="tools" id="tools">
        <button class="tool on" data-tool="select" title="Sélectionner / déplacer (V)">Sélection</button>
        <button class="tool" data-tool="rect" title="Réservation rectangulaire (R)">Rectangle</button>
        <button class="tool" data-tool="circle" title="Réservation ronde (C)">Ronde</button>
        <button class="tool" data-tool="meas" title="Mesurer une distance (M)">Mesure</button>
        <button class="tool" data-tool="scale" title="Définir l'échelle du plan (E)">Échelle</button>
        <button class="tool" data-tool="org" title="Poser le point de repère (P)">Repère</button>
        <button class="tool" data-tool="pan" title="Déplacer la vue (H)">Main</button>
      </div>
      <div class="tools panes" id="panes" title="Afficher / masquer les panneaux">
        <button class="tool" data-pane="lv">Niveaux</button>
        <button class="tool" data-pane="ly">Calques</button>
        <button class="tool" data-pane="pr">Propriétés</button>
      </div>
      <label class="pill" title="Afficher un autre niveau en transparence sous le plan courant">
        Superposer
        <select id="under"></select>
        <input type="range" id="underOp" min="10" max="90" value="45">
      </label>
      <label class="pill"><input type="checkbox" id="gridChk"> Trame 1 m</label>
      <button class="btn sm" id="fitBtn" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#cfd6e0">Recadrer</button>
      <button class="btn sm primary" id="repBtn" title="Exporter les plans de tous les niveaux (PDF)">Exporter</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <aside class="side" id="sideR">
    <section class="card" id="cardPr">
      <header>
        <h2>Propriétés</h2>
        <span class="sp"></span>
        <button class="btn ghost sm" data-hide="pr" title="Masquer le panneau">–</button>
      </header>
      <div id="insp"></div>
    </section>
  </aside>

  <div class="tabs">
    <button data-tab="lv">Niveaux</button>
    <button data-tab="ly" class="on">Calques</button>
    <button data-tab="pr">Propriétés</button>
  </div>
</div>

<input type="file" id="file" accept="image/*,application/pdf" multiple hidden>

<script>
(function(){
"use strict";
try{ if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}

/* ============ état ============ */
var S={ levels:[], shapes:[], activeId:null, selId:null, tool:"select",
        view:{s:1,tx:0,ty:0}, under:"", underOp:.45, grid:false, seq:1,
        asc:true,            /* true : le 1er de la liste est le niveau le plus bas */
        title:"", layers:[], activeLayer:null, types:undefined, ui:{lv:true,ly:true,pr:true,lst:"ly",exp:{fmt:"orig",ori:"auto"}} };
var PAL=["#c8492a","#1f6f8b","#2d7a4f","#8a5bbf","#9d7312","#1f8b7e"];
var cv=document.getElementById("cv"), ctx=cv.getContext("2d"), dpr=1;
var stage=document.getElementById("stage");
var calLine=null;   // ligne de cote tracée pour l'échelle (px plan)
var meas=null;      // mesure en cours / affichée
var drag=null;      // interaction en cours
var cursor=null;
var booting=true;

function uid(){ return Math.random().toString(36).slice(2,9); }
function active(){ return S.levels.find(function(l){return l.id===S.activeId;})||null; }
function sel(){ return S.shapes.find(function(s){return s.id===S.selId;})||null; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function fmt(v,d){ return (Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toFixed(d); }

/* ============ calques ============ */
function layerOf(sh){ return S.layers.find(function(l){ return l.id===sh.ly; })||null; }
function colOf(sh){ var t=sh.ty&&typeOf(sh.ty); if(t) return t.c; var l=layerOf(sh); return l? l.c : (sh.c||PAL[0]); }
function typeOf(id){ return (S.types||[]).find(function(t){ return t.id===id; })||null; }
function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function typeDim(t){ return t.t==="rect"? Math.round(t.w*100)+"×"+Math.round(t.h*100)+" cm" : "Ø"+Math.round(t.r*200)+" cm"; }
/* objets : types de réservation (GT, VH, VB…) avec forme, cotes, couleur et calque par défaut */
function fixTypes(){
  if(!Array.isArray(S.types)) S.types=[
    {code:"GT",name:"Gaine technique",t:"rect",w:.6,h:.4},
    {code:"VH",name:"Ventilation haute",t:"circle",r:.1},
    {code:"VB",name:"Ventilation basse",t:"circle",r:.1}
  ].map(function(d,i){ d.id=uid(); d.c=PAL[[0,1,3][i]]; return d; });
  S.types=S.types.filter(function(t){ return t&&t.id; });
  S.types.forEach(function(t){
    if(!/^#[0-9a-f]{6}$/i.test(t.c||"")) t.c=PAL[0];
    t.code=String(t.code||"OBJ"); t.name=String(t.name||""); if(t.t!=="circle") t.t="rect";
    if(t.t==="rect"){ if(!(t.w>0)) t.w=.5; if(!(t.h>0)) t.h=.5; } else if(!(t.r>0)) t.r=.1;
    if(!S.layers.some(function(l){ return l.id===t.ly; })) t.ly=S.activeLayer;
  });
  S.shapes.forEach(function(s){ if(s.ty&&!typeOf(s.ty)) delete s.ty; });
}
/* « GT » → « GT n+1 », n = plus grand numéro déjà utilisé */
function typeName(code){
  var re=new RegExp("^"+escRe(code)+"\\s+(\\d+)$","i"), max=0;
  S.shapes.forEach(function(x){ var m=String(x.n).trim().match(re); if(m) max=Math.max(max,parseInt(m[1],10)); });
  return code+" "+(max+1);
}
/* changement de code : « GT 3 » devient « GTH 3 », les noms personnalisés ne bougent pas */
function renameType(t,old){
  if(!old||old===t.code) return 0;
  var re=new RegExp("^"+escRe(old)+"(\\s+\\d+)$","i"), n=0;
  S.shapes.forEach(function(s){ if(s.ty!==t.id) return; var m=String(s.n).trim().match(re); if(m){ s.n=t.code+m[1]; n++; } });
  return n;
}
function shown(sh){ var l=layerOf(sh); return !l||l.vis!==false; }
function newLayer(name){ var n=S.layers.length;
  var l={id:uid(), name:name||("Calque "+(n+1)), c:PAL[n%PAL.length], vis:true, open:true};
  S.layers.push(l); return l; }
/* au moins un calque, un calque actif valide, chaque réservation rangée dans un calque existant */
function fixLayers(){
  S.layers=(S.layers||[]).filter(function(l){ return l&&l.id; });
  S.layers.forEach(function(l){ if(!/^#[0-9a-f]{6}$/i.test(l.c||"")) l.c=PAL[0]; l.name=String(l.name||"Calque"); });
  if(!S.layers.length) newLayer("Réservations");
  if(!S.layers.some(function(l){ return l.id===S.activeLayer; })) S.activeLayer=S.layers[0].id;
  S.shapes.forEach(function(s){ if(!layerOf(s)) s.ly=S.layers[0].id; });
  fixTypes();
}

/* ============ géométrie ============ */
/* calage d'un plan : 2 points en pixels + distance réelle → origine, rotation, échelle */
function ready(lv){ return !!(lv&&lv.scale&&lv.scale.s>0&&lv.org); }
function cal(lv){
  if(!ready(lv)) return {ax:0,ay:0,s:1,co:1,si:0,raw:true};
  var th=(lv.rot||0)*Math.PI/180;
  return {ax:lv.org.x,ay:lv.org.y,s:lv.scale.s,co:Math.cos(th),si:Math.sin(th),raw:false};
}
function scaleTxt(lv){
  if(!lv||!lv.scale) return "—";
  return lv.scale.ratio? "1/"+lv.scale.ratio : fmt(lv.scale.s,1)+" px/m";
}
/* reprise des anciens calages 2 points */
function migrate(l){
  if(l.cal && !l.scale){
    var c=l.cal, L=Math.hypot(c.bx-c.ax,c.by-c.ay);
    if(L&&c.d){ l.scale={s:L/c.d, ratio:(l.sc?l.sc.ratio:null), paper:(l.sc?l.sc.paper:null)};
      l.org={x:c.ax,y:c.ay}; l.rot=Math.atan2(c.by-c.ay,c.bx-c.ax)*180/Math.PI; }
    l.cal=null; l.sc=null;
  }
  return l;
}
function w2p(lv,X,Y){ var c=cal(lv); return {x:c.ax+c.s*(X*c.co-Y*c.si), y:c.ay+c.s*(X*c.si+Y*c.co)}; }
function p2w(lv,px,py){ var c=cal(lv),dx=(px-c.ax)/c.s,dy=(py-c.ay)/c.s;
  return {X:dx*c.co+dy*c.si, Y:-dx*c.si+dy*c.co}; }
/* applique une modification de calage sans faire bouger le plan à l'écran */
function keepView(lv,anchor,fn){
  var pre=cal(lv), w0=p2w(lv,anchor.x,anchor.y), s0=w2s(w0.X,w0.Y);
  fn();
  var post=cal(lv);
  if(pre.s>0&&post.s>0) S.view.s=S.view.s*(post.s/pre.s);
  var w1=p2w(lv,anchor.x,anchor.y), s1=w2s(w1.X,w1.Y);
  S.view.tx+=s0.x-s1.x; S.view.ty+=s0.y-s1.y;
}
function w2s(X,Y){ return {x:X*S.view.s+S.view.tx, y:Y*S.view.s+S.view.ty}; }
function s2w(x,y){ return {X:(x-S.view.tx)/S.view.s, Y:(y-S.view.ty)/S.view.s}; }
function evPos(e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }

/* échelle papier : px de l'image par mm de papier */
var PAPER={A4:[297,210],A3:[420,297],A2:[594,420],A1:[841,594],A0:[1189,841]};
function pxPerMm(lv,paper){
  if(!lv) return null;
  if(lv.pdf) return lv.pdf.base/(25.4/72);
  var P=PAPER[paper]; if(!P||!lv.w) return null;
  var land=lv.w>=lv.h;
  return lv.w/(land?P[0]:P[1]);
}

/* ============ persistance (IndexedDB) ============ */
function db(){ return new Promise(function(res,rej){
  try{ var r=indexedDB.open("resa-plans",1);
    r.onupgradeneeded=function(){ r.result.createObjectStore("kv"); };
    r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); };
  }catch(err){ rej(err); } }); }
function pack(){ return { levels:S.levels.map(function(l){
    return {id:l.id,name:l.name,src:l.src,w:l.w,h:l.h,scale:l.scale,org:l.org,rot:l.rot,pdf:l.pdf}; }),
    shapes:S.shapes, activeId:S.activeId, seq:S.seq, demo:S.demo, asc:S.asc, title:S.title,
    layers:S.layers, activeLayer:S.activeLayer, types:S.types, ui:S.ui }; }
var saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(function(){
  db().then(function(d){ var t=d.transaction("kv","readwrite"); t.objectStore("kv").put(pack(),"project"); })
      .catch(function(){}); },400); }
function load(){ return db().then(function(d){ return new Promise(function(res){
    var r=d.transaction("kv","readonly").objectStore("kv").get("project");
    r.onsuccess=function(){ res(r.result||null); }; r.onerror=function(){ res(null); }; }); })
  .catch(function(){ return null; }); }

function loadImg(lv){ return new Promise(function(res){
  var i=new Image(); i.onload=function(){ lv.img=i; lv.w=i.naturalWidth; lv.h=i.naturalHeight; res(); };
  i.onerror=function(){ res(); }; i.src=lv.src; }); }

/* ============ import ============ */
document.getElementById("addBtn").onclick=function(){ document.getElementById("file").click(); };
document.getElementById("ordBtn").onclick=function(){ S.asc=!S.asc; renderAll(); save();
  note(S.asc?"Liste rangée du bas vers le haut (1er = niveau le plus bas).":"Liste rangée du haut vers le bas (1er = niveau le plus haut)."); };
function ordLabel(){ document.getElementById("ordBtn").textContent = S.asc? "↑ bas → haut" : "↓ haut → bas"; }
document.getElementById("file").onchange=function(e){ var f=Array.prototype.slice.call(e.target.files); e.target.value=""; if(f.length) importFiles(f); };

stage.addEventListener("dragover",function(e){ e.preventDefault(); });
stage.addEventListener("drop",function(e){ e.preventDefault();
  var f=Array.prototype.slice.call(e.dataTransfer.files); if(f.length) importFiles(f); });

function guessName(fn){
  var n=fn.replace(/\.[^.]+$/,"");
  var m=n.match(/\b(R\s*\+\s*\d+|RDC|R\.D\.C|SS\s*-?\s*\d+|S\.?SOL|COMBLES|TOITURE|TERRASSE|NIVEAU\s*-?\d+|N\s*-?\d+)\b/i);
  if(m) return m[0].toUpperCase().replace(/\s+/g,"").replace("R+","R+");
  return n.slice(0,34);
}
function importFiles(files){
  files.sort(function(a,b){ return a.name.localeCompare(b.name,"fr",{numeric:true}); });
  var jobs=files.map(function(f){ return fileToLevels(f); });
  Promise.all(jobs).then(function(groups){
    var added=[];
    groups.forEach(function(g){ g.forEach(function(l){ S.levels.push(l); added.push(l); }); });
    if(added.length){ if(!S.activeId) S.activeId=added[0].id; }
    return Promise.all(added.map(loadImg));
  }).then(function(){ if(S.demo){ S.demo=false; } fit(); renderAll(); save(); });
}
function fileToLevels(f){
  if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)) return pdfToLevels(f);
  return new Promise(function(res){
    var fr=new FileReader();
    fr.onload=function(){ res([{id:uid(),name:guessName(f.name),src:fr.result,cal:null}]); };
    fr.onerror=function(){ res([]); }; fr.readAsDataURL(f);
  });
}
function pdfToLevels(f){
  if(!window.pdfjsLib){ note("Lecture PDF indisponible — exportez le plan en PNG/JPG."); return Promise.resolve([]); }
  var bytes=null;
  return f.arrayBuffer().then(function(buf){
    bytes=new Uint8Array(buf);
    return pdfjsLib.getDocument({data:bytes.slice()}).promise;
  }).then(function(pdf){
    var out=[],chain=Promise.resolve();
    for(var p=1;p<=pdf.numPages;p++)(function(p){
      chain=chain.then(function(){ return pdf.getPage(p); }).then(function(page){
        var v1=page.getViewport({scale:1});
        var sc=Math.min(3400/v1.width, 3400/v1.height, 4);
        var v=page.getViewport({scale:sc});
        var c=document.createElement("canvas"); c.width=Math.round(v.width); c.height=Math.round(v.height);
        var g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height);
        return page.render({canvasContext:g,viewport:v}).promise.then(function(){
          out.push({id:uid(), name:(pdf.numPages>1? guessName(f.name)+" p."+p : guessName(f.name)),
                    src:c.toDataURL("image/jpeg",.92), cal:null,
                    pdf:{bytes:bytes, page:p, base:sc}});
        });
      });
    })(p);
    return chain.then(function(){ return out; });
  }).catch(function(){ note("PDF illisible — exportez le plan en PNG/JPG."); return []; });
}

/* ============ vue ============ */
function fit(){
  var lv=active(); if(!lv||!lv.img) return;
  var cs=[[0,0],[lv.w,0],[lv.w,lv.h],[0,lv.h]].map(function(p){ return p2w(lv,p[0],p[1]); });
  var xs=cs.map(function(p){return p.X;}), ys=cs.map(function(p){return p.Y;});
  var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
  var y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  var W=stage.clientWidth, H=stage.clientHeight;
  var s=Math.min((W-80)/Math.max(x1-x0,1e-6),(H-100)/Math.max(y1-y0,1e-6));
  S.view.s=s; S.view.tx=W/2-(x0+x1)/2*s; S.view.ty=H/2-(y0+y1)/2*s;
  draw(); scheduleRefine();
}
document.getElementById("fitBtn").onclick=fit;

function resize(){
  dpr=Math.max(1,Math.min(window.devicePixelRatio||1,3));
  cv.width=Math.round(stage.clientWidth*dpr); cv.height=Math.round(stage.clientHeight*dpr);
  /* page chargée dans une fenêtre encore sans taille : recadrer dès qu'elle en a une */
  if(!(S.view.s>0)) fit();
  draw(); scheduleRefine();
}
new ResizeObserver(resize).observe(stage);

/* ============ rendu scène ============ */
function base(){ ctx.setTransform(dpr,0,0,dpr,0,0); }
/* ---- rendu fin : re-rastérisation de la zone visible d'un PDF au zoom courant ---- */
var refineT=null, refineSeq=0;
function scheduleRefine(){ clearTimeout(refineT); refineT=setTimeout(refine,150); }
function pdfPage(lv){
  if(lv._page) return Promise.resolve(lv._page);
  if(!window.pdfjsLib||!lv.pdf) return Promise.reject();
  return pdfjsLib.getDocument({data:lv.pdf.bytes.slice()}).promise
    .then(function(d){ return d.getPage(lv.pdf.page); })
    .then(function(pg){ lv._page=pg; return pg; });
}
function refine(){
  var lv=active(); if(!lv||!lv.pdf||!lv.img) return;
  var c=cal(lv), k=S.view.s/c.s*dpr;
  if(c.raw) k=S.view.s*dpr;
  if(k<=1.05){ if(lv.tile){ lv.tile=null; draw(); } return; }
  var W=stage.clientWidth,H=stage.clientHeight;
  var ps=[[0,0],[W,0],[W,H],[0,H]].map(function(q){ var w=s2w(q[0],q[1]); return w2p(lv,w.X,w.Y); });
  var xs=ps.map(function(q){return q.x;}), ys=ps.map(function(q){return q.y;});
  var x0=Math.max(0,Math.floor(Math.min.apply(null,xs))-6), x1=Math.min(lv.w,Math.ceil(Math.max.apply(null,xs))+6);
  var y0=Math.max(0,Math.floor(Math.min.apply(null,ys))-6), y1=Math.min(lv.h,Math.ceil(Math.max.apply(null,ys))+6);
  var tw=x1-x0, th=y1-y0; if(tw<4||th<4) return;
  var f=Math.min(k, 2800/tw, 2800/th, 8);
  if(f<=1.05) return;
  var t=lv.tile;
  if(t && t.f>=f*0.92 && t.x0<=x0 && t.y0<=y0 && t.x0+t.w>=x1 && t.y0+t.h>=y1) return;
  var seq=++refineSeq;
  if(lv._task){ try{ lv._task.cancel(); }catch(e){} lv._task=null; }
  pdfPage(lv).then(function(pg){
    if(seq!==refineSeq) return;
    var vp=pg.getViewport({scale:lv.pdf.base*f});
    var cs=document.createElement("canvas");
    cs.width=Math.round(tw*f); cs.height=Math.round(th*f);
    var g=cs.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,cs.width,cs.height);
    var task=pg.render({canvasContext:g, viewport:vp, transform:[1,0,0,1,-x0*f,-y0*f]});
    lv._task=task;
    return task.promise.then(function(){
      if(seq!==refineSeq) return;
      lv.tile={cv:cs,x0:x0,y0:y0,w:tw,h:th,f:f}; lv._task=null; draw();
    });
  }).catch(function(){});
}
function drawPlan(lv,alpha){
  if(!lv||!lv.img) return;
  var c=cal(lv), k=S.view.s/c.s;
  var a=k*c.co, b=-k*c.si, cc=k*c.si, d=k*c.co;
  var e=S.view.tx-k*(c.co*c.ax+c.si*c.ay);
  var f=S.view.ty-k*(-c.si*c.ax+c.co*c.ay);
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.setTransform(dpr*a,dpr*b,dpr*cc,dpr*d,dpr*e,dpr*f);
  ctx.imageSmoothingQuality="high";
  try{ ctx.drawImage(lv.img,0,0);
       if(lv.tile) ctx.drawImage(lv.tile.cv, lv.tile.x0, lv.tile.y0, lv.tile.w, lv.tile.h);
  }catch(err){}
  ctx.restore(); base();
}
function drawGrid(){
  var W=stage.clientWidth,H=stage.clientHeight,s=S.view.s;
  if(s<7) return;
  var a=s2w(0,0), b=s2w(W,H);
  ctx.save(); ctx.strokeStyle=css("--stage-grid"); ctx.lineWidth=1;
  ctx.beginPath();
  for(var X=Math.ceil(a.X);X<=b.X;X++){ var p=w2s(X,0); ctx.moveTo(p.x+.5,0); ctx.lineTo(p.x+.5,H); }
  for(var Y=Math.ceil(a.Y);Y<=b.Y;Y++){ var q=w2s(0,Y); ctx.moveTo(0,q.y+.5); ctx.lineTo(W,q.y+.5); }
  ctx.stroke(); ctx.restore();
}
function onLevel(sh,id){ return !sh.levels || sh.levels.indexOf(id)>=0; }
function obs(sh,id){ if(!sh.obs) sh.obs={}; if(!sh.obs[id]) sh.obs[id]={st:"",c:"",real:null}; return sh.obs[id]; }
function obsOf(sh,id){ return (sh.obs&&sh.obs[id])||null; }
function koCount(sh){ var n=0; if(sh.obs) for(var k in sh.obs) if(sh.obs[k].st==="ko"&&lvIndex(k)>=0) n++; return n; }
function ecart(sh,o){ if(!o||!o.real) return null;
  var cx=sh.t==="rect"?sh.x+sh.w/2:sh.x, cy=sh.t==="rect"?sh.y+sh.h/2:sh.y;
  return {dx:o.real.X-cx, dy:o.real.Y-cy, d:Math.hypot(o.real.X-cx,o.real.Y-cy)}; }
/* emprise réelle d'une anomalie : position pointée (centre) et dimensions reprises, sinon celles prévues */
function realShape(sh,o){ if(!o||!o.real) return null; var R=o.real;
  if(sh.t==="rect"){ var w=R.w||sh.w, h=R.h||sh.h; return {t:"rect",x:R.X-w/2,y:R.Y-h/2,w:w,h:h}; }
  return {t:"circle",x:R.X,y:R.Y,r:R.r||sh.r}; }
function dimsChanged(sh,o){ var r=realShape(sh,o); if(!r) return false;
  return sh.t==="rect"? (Math.round(r.w*100)!==Math.round(sh.w*100)||Math.round(r.h*100)!==Math.round(sh.h*100))
                      : Math.round(r.r*200)!==Math.round(sh.r*200); }
function dimPair(sh,o){ var r=realShape(sh,o);
  if(!r||!dimsChanged(sh,o)) return dimTxt(sh);
  return dimTxt(sh).replace(/ cm$/,"")+" → "+dimTxt(r); }
function inShape(r,W){ return r.t==="rect"? (W.X>=r.x&&W.X<=r.x+r.w&&W.Y>=r.y&&W.Y<=r.y+r.h) : Math.hypot(W.X-r.x,W.Y-r.y)<=r.r; }
/* position attendue sur un niveau : la dernière correction pointée en dessous (et reportée)
   remplace la position du projet pour les niveaux du dessus ; .from = niveau d'où elle vient */
function at(sh,lvId){
  var i=lvIndex(lvId); if(i<0||!sh.obs) return sh;
  var below=S.asc? S.levels.slice(0,i).reverse() : S.levels.slice(i+1);
  for(var k=0;k<below.length;k++){
    var L=below[k]; if(!onLevel(sh,L.id)) continue;
    var o=sh.obs[L.id];
    if(o&&o.st==="ko"&&o.real&&o.prop!==false){
      var r=realShape(at(sh,L.id),o);
      return Object.assign({},sh,r,{t:sh.t,from:L.id});
    }
  }
  return sh;
}
function lvName(id){ var i=lvIndex(id); return i>=0? S.levels[i].name : "?"; }
/* niveaux qui reprennent la correction pointée sur lvId */
function heirs(sh,lvId){ return S.levels.filter(function(L){ return L.id!==lvId&&onLevel(sh,L.id)&&at(sh,L.id).from===lvId; })
  .map(function(L){ return L.name; }); }
function centerOf(s){ return {X:s.t==="rect"?s.x+s.w/2:s.x, Y:s.t==="rect"?s.y+s.h/2:s.y}; }
function lvIndex(id){ for(var i=0;i<S.levels.length;i++) if(S.levels[i].id===id) return i; return -1; }
function idsFrom(id,up){   /* niveaux à partir de id, vers le haut ou vers le bas du bâtiment */
  var i=lvIndex(id); if(i<0) return null;
  return ((up===S.asc)? S.levels.slice(i) : S.levels.slice(0,i+1)).map(function(l){ return l.id; });
}
function corners(sh){
  if(sh.t==="rect") return [[sh.x,sh.y],[sh.x+sh.w,sh.y],[sh.x+sh.w,sh.y+sh.h],[sh.x,sh.y+sh.h]];
  return [[sh.x-sh.r,sh.y-sh.r],[sh.x+sh.r,sh.y-sh.r],[sh.x+sh.r,sh.y+sh.r],[sh.x-sh.r,sh.y+sh.r]];
}
function drawShape(sh,here,isSel){
  var lvA=active();
  if(here&&lvA&&sh.id!=="_"){
    var att=at(sh,lvA.id);
    if(att.from){
      /* correction reportée : contour du projet en filigrane, réservation à sa position corrigée */
      ctx.save(); ctx.globalAlpha=.35;
      outline(sh,0,0,colOf(sh),[3,4],w2s,1);
      var c1=centerOf(sh), c2=centerOf(att), p1=w2s(c1.X,c1.Y), p2=w2s(c2.X,c2.Y);
      ctx.strokeStyle=colOf(sh); ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
      ctx.restore();
      sh=att;
    }
  }
  var o=(here&&lvA)?obsOf(sh,lvA.id):null;
  var ko=!!(o&&o.st==="ko");
  var col=ko? "#d8352a" : colOf(sh);
  ctx.save();
  ctx.lineWidth=isSel?2.5:(here?2:1.4);
  ctx.strokeStyle=col;
  ctx.globalAlpha=here?1:.55;
  if(!here){ ctx.setLineDash([6,5]); }
  ctx.beginPath();
  if(sh.t==="rect"){
    var p=corners(sh).map(function(q){ return w2s(q[0],q[1]); });
    ctx.moveTo(p[0].x,p[0].y); for(var i=1;i<4;i++) ctx.lineTo(p[i].x,p[i].y); ctx.closePath();
  }else{
    var c0=w2s(sh.x,sh.y); ctx.arc(c0.x,c0.y,Math.max(sh.r*S.view.s,1),0,6.2832);
  }
  if(here){ ctx.globalAlpha=.13; ctx.fillStyle=col; ctx.fill(); ctx.globalAlpha=1; }
  ctx.stroke();
  /* centre */
  var cc=w2s(sh.t==="rect"?sh.x+sh.w/2:sh.x, sh.t==="rect"?sh.y+sh.h/2:sh.y);
  ctx.setLineDash([]); ctx.globalAlpha=here?.9:.5; ctx.strokeStyle=col; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(cc.x-5,cc.y); ctx.lineTo(cc.x+5,cc.y);
  ctx.moveTo(cc.x,cc.y-5); ctx.lineTo(cc.x,cc.y+5); ctx.stroke();
  /* étiquette */
  if(S.view.s>5){
    var tl=w2s(sh.t==="rect"?sh.x:sh.x-sh.r, sh.t==="rect"?sh.y:sh.y-sh.r);
    var txt=sh.n+"  "+dimTxt(sh)+(sh.from?"  ↳ "+lvName(sh.from):"");
    ctx.font="500 11px "+("'IBM Plex Mono', monospace");
    var w=ctx.measureText(txt).width+10;
    ctx.globalAlpha=here?.95:.6; ctx.fillStyle=col;
    ctx.fillRect(tl.x,tl.y-17,w,15);
    ctx.fillStyle="#fff"; ctx.globalAlpha=1; ctx.fillText(txt,tl.x+5,tl.y-6);
  }
  if(ko){
    var cen=w2s(sh.t==="rect"?sh.x+sh.w/2:sh.x, sh.t==="rect"?sh.y+sh.h/2:sh.y);
    if(o.real){
      var ec=ecart(sh,o), rp=w2s(o.real.X,o.real.Y), rs=realShape(sh,o);
      outline(rs,0,0,"#d8352a",[7,5],w2s,isSel?1.8:1,.1);
      ctx.setLineDash([4,4]); ctx.strokeStyle="#d8352a"; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(cen.x,cen.y); ctx.lineTo(rp.x,rp.y); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(rp.x,rp.y,3.5,0,6.2832); ctx.fillStyle="#d8352a"; ctx.fill();
      ctx.font="600 11px 'IBM Plex Mono', monospace"; ctx.fillStyle="#d8352a";
      ctx.fillText("réel"+(dimsChanged(sh,o)?" "+dimTxt(rs):"")+" · écart "+Math.round(ec.d*100)+" cm",rp.x+9,rp.y-7);
      if(isSel){
        ctx.fillStyle="#d8352a"; ctx.strokeStyle="#fff"; ctx.lineWidth=1.5;
        handles(rs).forEach(function(h){ var q=w2s(h.X,h.Y);
          ctx.beginPath(); ctx.rect(q.x-4.5,q.y-4.5,9,9); ctx.fill(); ctx.stroke(); });
      }
    }
    var bx=w2s(sh.t==="rect"?sh.x+sh.w:sh.x+sh.r, sh.t==="rect"?sh.y:sh.y-sh.r);
    ctx.globalAlpha=1; ctx.fillStyle="#d8352a";
    ctx.beginPath(); ctx.arc(bx.x+8,bx.y-8,8,0,6.2832); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="700 12px 'Archivo', sans-serif"; ctx.textAlign="center";
    ctx.fillText("!",bx.x+8,bx.y-3.5); ctx.textAlign="left";
  }
  if(isSel && here && !sh.from){
    ctx.globalAlpha=1; ctx.fillStyle=css("--panel"); ctx.strokeStyle=col; ctx.lineWidth=1.5;
    handles(sh).forEach(function(h){ var p=w2s(h.X,h.Y);
      ctx.beginPath(); ctx.rect(p.x-4,p.y-4,8,8); ctx.fill(); ctx.stroke(); });
  }
  ctx.restore();
}
/* contour d'une réservation, éventuellement décalée (dx,dy en m) */
function outline(sh,dx,dy,col,dash,P,lw,fill){
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw||2; if(dash) ctx.setLineDash(dash);
  ctx.beginPath();
  if(sh.t==="rect"){ var q=corners(sh).map(function(z){ return P(z[0]+dx,z[1]+dy); });
    ctx.moveTo(q[0].x,q[0].y); for(var i=1;i<4;i++) ctx.lineTo(q[i].x,q[i].y); ctx.closePath(); }
  else{ var c0=P(sh.x+dx,sh.y+dy); ctx.arc(c0.x,c0.y,Math.max(sh.r*S.view.s,1),0,6.2832); }
  if(fill){ ctx.globalAlpha=fill; ctx.fillStyle=col; ctx.fill(); ctx.globalAlpha=1; }
  ctx.stroke(); ctx.restore();
}
function handles(sh){
  if(sh.t==="rect") return corners(sh).map(function(q,i){ return {X:q[0],Y:q[1],i:i}; });
  return [{X:sh.x+sh.r,Y:sh.y,i:0}];
}
function dimTxt(sh){
  return sh.t==="rect" ? Math.round(sh.w*100)+"×"+Math.round(sh.h*100)+" cm"
                       : "Ø"+Math.round(sh.r*200)+" cm";
}
function drawCal(lv){
  if(!lv) return;
  var col=css("--blue");
  ctx.save(); ctx.lineWidth=1.8;
  if(lv.org){
    var w=p2w(lv,lv.org.x,lv.org.y), p=w2s(w.X,w.Y);
    ctx.strokeStyle=col; ctx.fillStyle=col;
    ctx.beginPath(); ctx.moveTo(p.x-11,p.y); ctx.lineTo(p.x+11,p.y);
    ctx.moveTo(p.x,p.y-11); ctx.lineTo(p.x,p.y+11); ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x,p.y,5,0,6.2832); ctx.stroke();
    ctx.font="600 10px 'IBM Plex Mono', monospace";
    ctx.fillText("REPÈRE 0,0",p.x+13,p.y-8);
  }
  if(calLine&&S.tool==="scale"){
    var a=p2w(lv,calLine.a.x,calLine.a.y), b=p2w(lv,calLine.b.x,calLine.b.y);
    var A=w2s(a.X,a.Y), B=w2s(b.X,b.Y);
    ctx.strokeStyle=css("--accent"); ctx.fillStyle=css("--accent"); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
    var an=Math.atan2(B.y-A.y,B.x-A.x)+Math.PI/2;
    [A,B].forEach(function(q){ ctx.beginPath();
      ctx.moveTo(q.x+Math.cos(an)*8,q.y+Math.sin(an)*8);
      ctx.lineTo(q.x-Math.cos(an)*8,q.y-Math.sin(an)*8); ctx.stroke(); });
  }
  ctx.restore();
}
function drawMeas(){
  var A=w2s(meas.a.X,meas.a.Y), B=w2s(meas.b.X,meas.b.Y);
  var L=Math.hypot(meas.b.X-meas.a.X, meas.b.Y-meas.a.Y);
  var col=css("--blue");
  ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
  var an=Math.atan2(B.y-A.y,B.x-A.x)+Math.PI/2;
  [A,B].forEach(function(p){ ctx.beginPath();
    ctx.moveTo(p.x+Math.cos(an)*7,p.y+Math.sin(an)*7);
    ctx.lineTo(p.x-Math.cos(an)*7,p.y-Math.sin(an)*7); ctx.stroke(); });
  var txt=(L<1? Math.round(L*1000)+" mm" : fmt(L,3)+" m");
  ctx.font="600 12px 'IBM Plex Mono', monospace";
  var w=ctx.measureText(txt).width+12, mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
  ctx.fillStyle=col; ctx.fillRect(mx-w/2,my-21,w,17);
  ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.fillText(txt,mx,my-8); ctx.textAlign="left";
  ctx.restore();
}
function draw(){
  base();
  ctx.clearRect(0,0,stage.clientWidth,stage.clientHeight);
  ctx.fillStyle=css("--stage"); ctx.fillRect(0,0,stage.clientWidth,stage.clientHeight);
  var lv=active();
  document.querySelector(".drop") && document.querySelector(".drop").remove();
  if(!lv){ emptyStage(); status(); return; }
  if(S.grid) drawGrid();
  if(S.under){ var u=S.levels.find(function(l){return l.id===S.under;});
    if(u&&u!==lv&&ready(u)&&ready(lv)) drawPlan(u,S.underOp); }
  drawPlan(lv,1);
  if(ready(lv)){
    var others=[],mine=[];
    S.shapes.forEach(function(sh){ if(shown(sh)) (onLevel(sh,lv.id)?mine:others).push(sh); });
    others.forEach(function(sh){ drawShape(sh,false,false); });
    mine.forEach(function(sh){ drawShape(sh,true,sh.id===S.selId); });
  }
  drawCal(lv);
  if(meas&&ready(lv)) drawMeas();
  if(drag&&drag.m==="draw"&&drag.prev) drawShape(drag.prev,true,false);
  if(S.tool==="stamp"&&cursor&&ready(lv)){ var gh=copyAt(cursor); if(gh) drawShape(gh,false,false); }
  status();
}
function emptyStage(){

   '<button class="btn" id="d2" style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:#dfe5ed">Charger l\'exemple</button></div>'+
   '<div class="steps"><span><b>1.</b> Importer et ordonner les niveaux</span>'+
   '<span><b>2.</b> Repère : 2 points + la cote réelle entre eux</span>'+
   '<span><b>3.</b> Dessiner la réservation — elle apparaît partout</span></div>';
  stage.appendChild(d);
  d.querySelector("#d1").onclick=function(){ document.getElementById("file").click(); };
  d.querySelector("#d2").onclick=demo;
}
function status(){
  var lv=active(), c=lv?cal(lv):null, out=[];
  out.push("<b>"+(lv?lv.name:"—")+"</b>");
  if(lv) out.push("échelle <b>"+(lv.scale?scaleTxt(lv):"—")+"</b>");
  if(lv&&!lv.org) out.push("<b style='color:#ef9070'>repère à poser</b>");
  if(cursor) out.push("X <b>"+fmt(cursor.X,2)+"</b> m &nbsp; Y <b>"+fmt(cursor.Y,2)+"</b> m");
  out.push("vue <b>"+fmt(S.view.s,1)+"</b> px/m");
  if(meas) out.push("mesure <b>"+fmt(Math.hypot(meas.b.X-meas.a.X,meas.b.Y-meas.a.Y),3)+"</b> m");
  out.push(S.shapes.length+" réservation"+(S.shapes.length>1?"s":""));

/* ============ messages ============ */
function note(msg,ms){
  var old=document.querySelector(".hint.auto"); if(old) old.remove();
  var h=document.createElement("div"); h.className="hint auto"; h.textContent=msg; stage.appendChild(h);
  setTimeout(function(){ h.remove(); }, ms||3600);
}
function hint(msg){
  var old=document.querySelector(".hint.live"); if(old) old.remove();
  if(!msg) return;
  var h=document.createElement("div"); h.className="hint live"; h.textContent=msg; stage.appendChild(h);
}

/* ============ outils ============ */
document.getElementById("tools").addEventListener("click",function(e){
  var b=e.target.closest(".tool"); if(!b) return; setTool(b.dataset.tool);
});
function setTool(t){
  S.tool=t;
  Array.prototype.forEach.call(document.querySelectorAll(".tool"),function(b){ b.classList.toggle("on",b.dataset.tool===t); });
  cv.style.cursor = t==="pan"?"grab" : t==="select"?"default":"crosshair";
  if(t!=="meas") meas=null;
  closeDock();
  if(t==="scale"){ openDock(); hint(""); }
  else if(t==="stamp") stampHint();
  else if(t==="org"){ hint("Cliquez le point de repère du plan — il devient l'origine (0,0) de ce niveau."); }
  else hint(t==="rect"?"Tracez le rectangle de la réservation.":t==="circle"?"Cliquez le centre puis tirez le rayon.":
       t==="meas"?"Tirez entre deux points — Maj pour contraindre à l'horizontale ou la verticale.":
       t==="real"?"Faites glisser la réservation jusqu'à sa position réelle sur le plan.":"");
  Array.prototype.forEach.call(document.querySelectorAll("#obList .ob"),function(r){
    r.classList.toggle("on",t==="stamp"&&!!objId&&r.dataset.id===objId); });
  draw();
}
document.addEventListener("keydown",function(e){
  if(/input|select|textarea/i.test(e.target.tagName)) return;
  var k=e.key.toLowerCase();
  if(e.ctrlKey||e.metaKey){ if(k==="d"&&sel()){ e.preventDefault(); startStamp(sel()); } return; }
  if(k==="v") setTool("select"); else if(k==="r") setTool("rect");
  else if(k==="c") setTool("circle"); else if(k==="e") setTool("scale");
  else if(k==="p") setTool("org");
  else if(k==="h") setTool("pan"); else if(k==="m") setTool("meas");
  else if(e.key==="Escape"){ if(S.tool==="stamp"){ setTool("select"); return; }
    meas=null; calLine=null; closeDock(); hint(""); S.selId=null; renderAll(); }
  else if(e.key==="Delete"||e.key==="Backspace"){ if(sel()){ delShape(S.selId); e.preventDefault(); } }
  else if(e.key.indexOf("Arrow")===0){
    var s=sel(); if(!s) return; e.preventDefault();
    var d=e.shiftKey?.10:.01;
    if(e.key==="ArrowLeft")s.x-=d; if(e.key==="ArrowRight")s.x+=d;
    if(e.key==="ArrowUp")s.y-=d; if(e.key==="ArrowDown")s.y+=d;
    round(s); renderAll(); save();
  }
});
function round(s){
  s.x=Math.round(s.x*1000)/1000; s.y=Math.round(s.y*1000)/1000;
  if(s.t==="rect"){ s.w=Math.round(s.w*1000)/1000; s.h=Math.round(s.h*1000)/1000; }
  else s.r=Math.round(s.r*1000)/1000;
}

/* ============ pointeur ============ */
var ptrs=new Map(), pinch=null;
cv.addEventListener("pointerdown",function(e){
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,evPos(e));
  if(ptrs.size===2){ var a=Array.from(ptrs.values());
    pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),c:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}};
    drag=null; return; }
  var p=evPos(e), lv=active(); if(!lv) return;
  var W=s2w(p.x,p.y);

  if(S.tool==="real"){
    var sh=sel(); if(!sh){ setTool("select"); return; }
    var oo=obs(sh,lv.id), sa=at(sh,lv.id), c0=centerOf(sa);
    var gx=oo.real?oo.real.X:c0.X, gy=oo.real?oo.real.Y:c0.Y;
    var inside=inShape(realShape(sa,{real:{X:gx,Y:gy,w:oo.real&&oo.real.w,h:oo.real&&oo.real.h,r:oo.real&&oo.real.r}}),W);
    if(!inside){ gx=W.X; gy=W.Y; }
    oo.st="ko"; oo.real=Object.assign({},oo.real||{},{X:gx,Y:gy});
    drag={m:"real",id:sh.id,dx:W.X-gx,dy:W.Y-gy};
    renderInsp(); draw(); return;
  }
  if(S.tool==="org"){
    var q=w2p(lv,W.X,W.Y);
    keepView(lv,q,function(){ lv.org={x:q.x,y:q.y}; lv.rot=lv.rot||0; });
    setTool("select"); renderAll(); save();
    note("Repère posé sur "+lv.name+(lv.scale?"":" — il reste l'échelle à définir."));
    if(!lv.scale) setTool("scale");
    return;
  }
  if(S.tool==="scale"){
    var q0=w2p(lv,W.X,W.Y);
    calLine={a:{x:q0.x,y:q0.y},b:{x:q0.x,y:q0.y}}; drag={m:"cal"}; draw(); return;
  }
  if(S.tool==="pan"||e.button===1){ drag={m:"pan",x:p.x,y:p.y,tx:S.view.tx,ty:S.view.ty}; cv.style.cursor="grabbing"; return; }
  if(S.tool==="stamp"){
    if(e.button!==0){ setTool("select"); return; }
    if(!ready(lv)){ note("Définissez l'échelle et le repère de ce plan."); return; }
    placeCopy(W); return;
  }
  if(!ready(lv) && (S.tool==="rect"||S.tool==="circle")){ note("Définissez l'échelle et le repère de ce plan."); return; }

  if(S.tool==="meas"){
    if(!ready(lv)){ note("Définissez l'échelle et le repère de ce plan."); return; }
    meas={a:{X:W.X,Y:W.Y},b:{X:W.X,Y:W.Y}}; drag={m:"meas"}; draw(); return;
  }
  if(S.tool==="rect"||S.tool==="circle"){
    drag={m:"draw",t:S.tool,sx:W.X,sy:W.Y,prev:null}; return;
  }
  /* sélection */
  var s=sel(), tol=7/S.view.s;
  if(s && onLevel(s,lv.id)){
    /* anomalie pointée : poignées rouges = dimensions réelles, intérieur = déplacer la position réelle */
    var sa=at(s,lv.id), so=obsOf(s,lv.id), rsh=(so&&so.st==="ko")?realShape(sa,so):null;
    if(rsh){
      var rh=handles(rsh);
      for(var j=0;j<rh.length;j++){
        if(Math.abs(rh[j].X-W.X)<tol && Math.abs(rh[j].Y-W.Y)<tol){
          drag={m:"rsize",id:s.id,i:rh[j].i,o:rsh}; return; }
      }
      if(inShape(rsh,W)){ drag={m:"real",id:s.id,dx:W.X-so.real.X,dy:W.Y-so.real.Y,quiet:true}; return; }
    }
    var hs=sa.from?[]:handles(s);
    for(var i=0;i<hs.length;i++){
      if(Math.abs(hs[i].X-W.X)<tol && Math.abs(hs[i].Y-W.Y)<tol){
        drag={m:"size",id:s.id,i:hs[i].i,o:JSON.parse(JSON.stringify(s))}; return; }
    }
  }
  var hit=pick(W,lv);
  if(hit){
    var ha=at(hit,lv.id); S.selId=hit.id;
    /* position reprise d'un niveau inférieur : on la corrige par un pointage, pas en déplaçant le projet */
    if(ha.from){ renderAll(); if(hit.id!==(s&&s.id)) note("Position reprise de "+lvName(ha.from)+" — si elle est encore décalée ici : « Déplacer vers la position réelle »."); return; }
    drag={m:"move",id:hit.id,dx:W.X-hit.x,dy:W.Y-hit.y}; renderAll(); return; }
  S.selId=null; renderAll();
  drag={m:"pan",x:p.x,y:p.y,tx:S.view.tx,ty:S.view.ty};
});
function pick(W,lv){
  for(var i=S.shapes.length-1;i>=0;i--){ var s=S.shapes[i];
    if(!onLevel(s,lv.id)||!shown(s)) continue;
    if(inShape(at(s,lv.id),W)) return s;
  }
  return null;
}
cv.addEventListener("pointermove",function(e){
  var p=evPos(e); if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,p);
  if(pinch&&ptrs.size===2){
    var a=Array.from(ptrs.values()), d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    var c={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
    var k=d/(pinch.d||1), w=s2w(pinch.c.x,pinch.c.y);
    S.view.s=Math.max(.5,Math.min(4000,S.view.s*k));
    S.view.tx=c.x-w.X*S.view.s; S.view.ty=c.y-w.Y*S.view.s;
    pinch={d:d,c:c}; draw(); scheduleRefine(); return;
  }
  cursor=s2w(p.x,p.y);
  if(!drag){ if(S.tool==="stamp") draw(); else status(); return; }
  var W=cursor;
  if(drag.m==="pan"){ S.view.tx=drag.tx+(p.x-drag.x); S.view.ty=drag.ty+(p.y-drag.y); draw(); return; }
  if(drag.m==="real"){
    var sr=S.shapes.find(function(x){return x.id===drag.id;}), lr=active();
    if(sr&&lr){ var oo=obs(sr,lr.id);
      oo.real.X=Math.round((W.X-drag.dx)*1000)/1000; oo.real.Y=Math.round((W.Y-drag.dy)*1000)/1000;
      drag.moved=true; draw(); renderInsp(); }
    return;
  }
  if(drag.m==="rsize"){
    var sz=S.shapes.find(function(x){return x.id===drag.id;}), lz=active();
    if(sz&&lz){ var oz=obs(sz,lz.id), r0=drag.o, mm=function(v){ return Math.round(v*1000)/1000; };
      if(sz.t==="circle"){ oz.real.r=mm(Math.max(.01,Math.hypot(W.X-oz.real.X,W.Y-oz.real.Y))); }
      else{
        var ax0=r0.x,ay0=r0.y,ax1=r0.x+r0.w,ay1=r0.y+r0.h;
        if(drag.i===0){ax0=W.X;ay0=W.Y;} if(drag.i===1){ax1=W.X;ay0=W.Y;}
        if(drag.i===2){ax1=W.X;ay1=W.Y;} if(drag.i===3){ax0=W.X;ay1=W.Y;}
        var rw=Math.max(.01,Math.abs(ax1-ax0)), rhh=Math.max(.01,Math.abs(ay1-ay0));
        oz.real.w=mm(rw); oz.real.h=mm(rhh);
        oz.real.X=mm(Math.min(ax0,ax1)+rw/2); oz.real.Y=mm(Math.min(ay0,ay1)+rhh/2);
      }
      draw(); renderInsp(); }
    return;
  }
  if(drag.m==="cal"&&calLine){
    var qc=w2p(lv2(),W.X,W.Y); calLine.b={x:qc.x,y:qc.y};
    if(e.shiftKey){ if(Math.abs(calLine.b.x-calLine.a.x)>Math.abs(calLine.b.y-calLine.a.y)) calLine.b.y=calLine.a.y; else calLine.b.x=calLine.a.x; }
    dockLine(); draw(); return;
  }
  if(drag.m==="meas"&&meas){
    meas.b={X:W.X,Y:W.Y};
    if(e.shiftKey){ if(Math.abs(W.X-meas.a.X)>Math.abs(W.Y-meas.a.Y)) meas.b.Y=meas.a.Y; else meas.b.X=meas.a.X; }
    draw(); return;
  }
  if(drag.m==="draw"){
    if(drag.t==="rect"){
      drag.prev={id:"_",n:"nouvelle",t:"rect",ly:S.activeLayer,
        x:Math.min(drag.sx,W.X),y:Math.min(drag.sy,W.Y),
        w:Math.abs(W.X-drag.sx),h:Math.abs(W.Y-drag.sy)};
    }else{
      drag.prev={id:"_",n:"nouvelle",t:"circle",ly:S.activeLayer,
        x:drag.sx,y:drag.sy,r:Math.hypot(W.X-drag.sx,W.Y-drag.sy)};
    }
    draw(); return;
  }
  var s=S.shapes.find(function(x){return x.id===drag.id;}); if(!s) return;

  if(drag.m==="size"){
    if(s.t==="circle"){ s.r=Math.max(.01,Math.hypot(W.X-s.x,W.Y-s.y)); }
    else{
      var o=drag.o, x0=o.x,y0=o.y,x1=o.x+o.w,y1=o.y+o.h;
      if(drag.i===0){x0=W.X;y0=W.Y;} if(drag.i===1){x1=W.X;y0=W.Y;}
      if(drag.i===2){x1=W.X;y1=W.Y;} if(drag.i===3){x0=W.X;y1=W.Y;}
      s.x=Math.min(x0,x1); s.y=Math.min(y0,y1);

function endPtr(e){
  ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
  if(!drag) return;
  if(drag.m==="cal"){ dockLine(true); drag=null; draw(); return; }
  if(drag.m==="real"){
    var sr=S.shapes.find(function(x){return x.id===drag.id;}), lr=active(), quiet=drag.quiet&&!drag.moved;
    drag=null; setTool("select");
    if(sr&&lr&&!quiet){ var ec2=ecart(at(sr,lr.id),obsOf(sr,lr.id)), up=heirs(sr,lr.id);
      note("Position réelle enregistrée — écart "+(ec2?Math.round(ec2.d*100):0)+" cm"+

    renderAll(); save(); return;
  }
  if(drag.m==="rsize"){
    var sq=S.shapes.find(function(x){return x.id===drag.id;}), lq=active();
    drag=null;
    if(sq&&lq){ var oq=obsOf(sq,lq.id), aq=at(sq,lq.id); note("Dimensions réelles : "+dimTxt(realShape(aq,oq))+" (prévu "+dimTxt(aq)+")."); }
    renderAll(); save(); return;
  }
  if(drag.m==="draw"&&drag.prev){
    var s=drag.prev;
    var big = s.t==="rect" ? (s.w>.02&&s.h>.02) : s.r>.02;
    if(big){
      s.id=uid(); s.n="RÉS "+(S.seq++); s.origin=S.activeId;
      s.levels=idsFrom(S.activeId,true); round(s);
      var L=layerOf(s); if(L){ L.vis=true; L.open=true; }
      S.shapes.push(s); S.selId=s.id; setTool("select"); renderAll(); save();
      var nb=s.levels?s.levels.length:S.levels.length;
      note((L?"Calque « "+L.name+" » — r":"R")+"eportée sur "+nb+" niveau"+(nb>1?"x":"")+" : celui-ci et ceux du dessus.");
    }
  }
  if(drag.m==="move"||drag.m==="size") save();
  if(drag.m==="pan"&&S.tool==="pan") cv.style.cursor="grab";
  if(drag.m==="pan") scheduleRefine();
  drag=null; draw();
}

    '<p class="dp" id="state"></p>';
  stage.appendChild(d);

    var bt=e.target.closest("button"); if(!bt) return;

    d.querySelector("#pL").hidden=mode!=="l"; d.querySelector("#pR").hidden=mode!=="r";
    if(mode==="r") rinfo();
  });
  var rv=d.querySelector("#rv"), pv=d.querySelector("#pv");
  function ratioS(){ var r=parseFloat(rv.value), pm=pxPerMm(lv,pv?pv.value:null);
    return (r>0&&pm)? pm*1000/r : null; }
  function rinfo(){ var sc=ratioS();
    d.querySelector("#rinfo").textContent = sc? "soit "+fmt(sc,1)+" px/m sur cette image"
      : "format papier nécessaire"; }
  rv.oninput=rinfo; if(pv) pv.onchange=rinfo; rinfo();
  d.querySelector("#state").textContent = lv.scale? "actuel : "+scaleTxt(lv)+(lv.org?" · repère posé":" · repère à poser")

  d.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); apply(); } });

  function apply(){
    var lv=active(); if(!lv) return;
    var ns=null, rot=parseFloat(d.querySelector("#rot").value); if(isNaN(rot)) rot=lv.rot||0;
    if(mode==="l"){
      if(!calLine){ note("Tracez d'abord la ligne de cote sur le plan."); return; }
      var L=Math.hypot(calLine.b.x-calLine.a.x, calLine.b.y-calLine.a.y);
      var v=parseFloat(d.querySelector("#dv").value);
      if(!(L>1)||!(v>0)){ d.querySelector("#dv").focus(); return; }
      ns={s:L/v, ratio:null, paper:null};
      if(d.querySelector("#hz").checked) rot=Math.atan2(calLine.b.y-calLine.a.y, calLine.b.x-calLine.a.x)*180/Math.PI;

    }
    var anchor=lv.org||w2p(lv,s2w(stage.clientWidth/2,stage.clientHeight/2).X,s2w(stage.clientWidth/2,stage.clientHeight/2).Y);
    keepView(lv,anchor,function(){ lv.scale=ns; lv.rot=rot; });
    var allChk=d.querySelector("#all"), nAll=0;

      /* même rapport 1/N partout, converti selon la résolution de chaque plan ; l'orientation reste propre à chaque plan */
      var pmSrc=pxPerMm(lv,mode==="r"&&pv?pv.value:(lv.scale.paper||null));

/* « Gaine VMC » → « Gaine VMC 2 », « Gaine VMC 2 » → numéro libre suivant */
function nextName(n){
  var base=n.replace(/\s*\d+$/,"").trim()||n.trim();
  var re=new RegExp("^"+base.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?:\\s+(\\d+))?$","i"), max=1;
  S.shapes.forEach(function(x){ var m=x.n.trim().match(re); if(m) max=Math.max(max,m[1]?parseInt(m[1],10):1); });
  return base+" "+(max+1);
}

function objSrc(){ return objId? typeOf(objId) : null; }
function startStamp(s){ objId=null; stampId=s.id; setTool("stamp"); }

  hint("Cliquez sur le plan pour poser "+(ob?"des « "+ob.code+" » (prochain : "+typeName(ob.code)+")":"des copies de « "+(src?src.n:"")+" »")+" — Échap ou clic droit pour terminer."); }
function copyAt(W){
  var ty=objSrc();
  if(ty){
    var n={id:uid(), n:typeName(ty.code), t:ty.t, ty:ty.id, ly:ty.ly, origin:S.activeId, levels:idsFrom(S.activeId,true)};
    if(ty.t==="rect"){ n.w=ty.w; n.h=ty.h; n.x=W.X-n.w/2; n.y=W.Y-n.h/2; } else { n.r=ty.r; n.x=W.X; n.y=W.Y; }
    round(n); return n;
  }
  var src=stampSrc(); if(!src) return null;
  var c=JSON.parse(JSON.stringify(src)); c.id=uid(); c.n=nextName(src.n); delete c.obs;
  if(c.t==="rect"){ c.x=W.X-c.w/2; c.y=W.Y-c.h/2; } else { c.x=W.X; c.y=W.Y; }
  round(c); return c;
}

var WIN_EXTRA="€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ";
function win(s){
  s=String(s).replace(/Δ/g,"d").replace(/−/g,"-").replace(/↳/g,">").replace(/→/g,"->").replace(/≈ ?/g,"env. ").replace(/[  ]/g," ");
  return Array.from(s).map(function(ch){ var c=ch.charCodeAt(0);

/* page de sortie d'un niveau ; k = points PDF par pixel de l'image de travail */
/* fond d'un niveau incorporé une seule fois dans le PDF de sortie : draw(page) le pose en coordonnées du niveau (Wd × Hd, origine en bas à gauche) */
function levelBase(out,l,cache){
  var L=window.PDFLib;
  if(l.pdf){
    return pdfPage(l).then(function(pg){
      var view=pg.view, rot=((pg.rotate||0)%360+360)%360, W=view[2]-view[0], H=view[3]-view[1];
      var src=cache.get(l.pdf.bytes);
      if(!src){ src=L.PDFDocument.load(l.pdf.bytes.slice(),{ignoreEncryption:true}); cache.set(l.pdf.bytes,src); }
      return src.then(function(doc){
        return out.embedPage(doc.getPage(l.pdf.page-1),{left:view[0],bottom:view[1],right:view[2],top:view[3]});
      }).then(function(emb){
        var Wd=rot%180===0?W:H, Hd=rot%180===0?H:W;
        var o= rot===90? {x:0,y:W,rotate:L.degrees(-90)} : rot===180? {x:W,y:H,rotate:L.degrees(180)} : rot===270? {x:H,y:0,rotate:L.degrees(90)} : {x:0,y:0};
        return {Wd:Wd,Hd:Hd,k:1/l.pdf.base,draw:function(page){ page.drawPage(emb,o); }};
      });
    });
  }
  var k=72/150, jpg=/^data:image\/jpe?g/i.test(l.src||""), data=l.src;
  if(!jpg&&!/^data:image\/png/i.test(l.src||"")){
    var c=document.createElement("canvas"); c.width=l.w; c.height=l.h; c.getContext("2d").drawImage(l.img,0,0); data=c.toDataURL("image/png");
  }

/* annotations vectorielles d'un niveau */
/* tailles des lignes du cartouche, en multiples de Tz ; sert aussi à calculer la hauteur du bandeau */
var HEAD_S=[1.3,.8,.8,.85,.72,.72];
function bandH(Tz){ return HEAD_S.reduce(function(h,s){ return h+Tz*s*1.22; },0)+Tz*.35*1.4+Tz*1.2; }
/* Tz : taille du texte en points sur la page d'origine, choisie pour qu'il s'imprime à ≈ 9 pt */

function annotate(info,l,rows,F,title,Tz,scaleLine,opt){
  var L=window.PDFLib, page=info.page, Wd=info.Wd, Hd=info.Hd, k=info.k, ppm=cal(l).s*k;
  var CL=opt&&opt.clip, BX=CL?CL.x:0, BY=CL?CL.y:0, BW=CL?CL.x+CL.w:Wd, BH=CL?CL.y+CL.h:Hd, BM=CL?Tz*.3:3;
  var lw=Math.max(.15,Tz/10), pad=Tz*.35;
  var RED=L.rgb(.78,.16,.12), WHITE=L.rgb(1,1,1), GREY=L.rgb(.45,.45,.45), boxes=[];
  function col(hex){ var c=hexRGB(hex); return L.rgb(c[0]/255,c[1]/255,c[2]/255); }
  function td(X,Y){ var p=w2p(l,X,Y); return {x:p.x*k, y:p.y*k}; }         /* haut → bas */
  function bu(X,Y){ var p=td(X,Y); return {x:p.x, y:Hd-p.y}; }             /* bas → haut (pdf-lib) */
  function shape(s,o){
    if(s.t==="rect"){
      var p=corners(s).map(function(q){ return td(q[0],q[1]); });
      page.drawSvgPath("M "+p.map(function(q){ return q.x.toFixed(2)+" "+q.y.toFixed(2); }).join(" L ")+" Z",
        {x:0,y:Hd,color:o.fill,opacity:o.op,borderColor:o.color,borderWidth:o.width,borderOpacity:1,borderDashArray:o.dash});
    }else{
      var c=bu(s.x,s.y);
      page.drawCircle({x:c.x,y:c.y,size:Math.max(s.r*ppm,.8),color:o.fill,opacity:o.op,borderColor:o.color,borderWidth:o.width,borderOpacity:1,borderDashArray:o.dash});
    }
  }
  function arrow(a,b,color,w){
    var len=Math.hypot(b.x-a.x,b.y-a.y); if(len<w*2) return;
    page.drawLine({start:a,end:b,thickness:w,color:color});
    var an=Math.atan2(b.y-a.y,b.x-a.x), s=Math.min(Tz*.7,len/2.5);
    var p1={x:b.x-s*Math.cos(an-.4),y:b.y-s*Math.sin(an-.4)}, p2={x:b.x-s*Math.cos(an+.4),y:b.y-s*Math.sin(an+.4)};
    page.drawSvgPath("M "+b.x+" "+(Hd-b.y)+" L "+p1.x+" "+(Hd-p1.y)+" L "+p2.x+" "+(Hd-p2.y)+" Z",{x:0,y:Hd,color:color,borderWidth:0});
  }
  function overlap(a,b){ return a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h; }
  function wrap(t,font,size,maxW){
    var words=win(t).split(" "), out=[], cur="";
    words.forEach(function(w){ var n=cur?cur+" "+w:w; if(font.widthOfTextAtSize(n,size)>maxW&&cur){ out.push(cur); cur=w; } else cur=n; });
    if(cur) out.push(cur); return out;
  }
  /* lignes : [{t, b(gras), s(taille), c(couleur)}] → dimensions de la boîte */
  function measure(lines){
    var w=0; lines.forEach(function(li){ w=Math.max(w,(li.b?F.b:F.r).widthOfTextAtSize(li.t,li.s)); });
    return {w:w+pad*2, h:lines.reduce(function(h,li){ return h+li.s*1.22; },0)+pad*1.4};
  }
  function drawBox(b,lines,border){
    var ro={x:b.x,y:b.y,width:b.w,height:b.h,color:WHITE,opacity:.93};
    if(border){ ro.borderColor=border; ro.borderWidth=lw*.9; ro.borderOpacity=1; }
    page.drawRectangle(ro);
    var y=b.y+b.h-pad*.7;
    lines.forEach(function(li){ y-=li.s; page.drawText(li.t,{x:b.x+pad,y:y+li.s*.12,size:li.s,font:li.b?F.b:F.r,color:li.c||L.rgb(0,0,0)}); y-=li.s*.22; });
  }
  /* emplacement libre près de (ax,ay), de préférence du côté (px,py), sans recouvrir une autre étiquette */
  function place(w,h,ax,ay,px,py,gap){
    for(var m=1;m<=4;m++){
      var c=[[px,py],[px,-py],[-px,py],[-px,-py]];
      for(var i=0;i<4;i++){
        var x=c[i][0]>0? ax+gap*m : ax-gap*m-w, y=c[i][1]>0? ay+gap*m : ay-gap*m-h, b={x:x,y:y,w:w,h:h};

        if(boxes.some(function(o){ return overlap(o,b); })) continue;
        boxes.push(b); return b;
      }
    }
    var f={x:Math.min(Math.max(BX+BM,ax+gap),BW-w-BM),y:Math.min(Math.max(BY+BM,ay+gap),BH-h-BM),w:w,h:h}; boxes.push(f); return f;
  }
  function leader(from,b){
    var to={x:Math.min(Math.max(from.x,b.x),b.x+b.w), y:Math.min(Math.max(from.y,b.y),b.y+b.h)};

  var head=[{t:win(l.name+" — contrôle des réservations"),b:1,s:Tz*HEAD_S[0]},
    {t:win([title,today()].filter(Boolean).join("  ·  ")),s:Tz*HEAD_S[1],c:GREY},
    {t:win(scaleLine),b:1,s:Tz*HEAD_S[2]},
    {t:win(rows.length+" réservation(s)  ·  "+kos+" anomalie(s)"),b:1,s:Tz*HEAD_S[3],c:kos?RED:L.rgb(0,0,0)},
    {t:win("Trait plein : position attendue  ·  Pointillé rouge : position réelle"),s:Tz*HEAD_S[4],c:GREY},
    {t:win("Écart X + vers la droite, Y + vers le bas du plan"),s:Tz*HEAD_S[5],c:GREY}];

  }

  /* contours : projet d'origine (si correction reprise), position attendue, position réelle */
  rows.forEach(function(r){
    var c=col(colOf(r.orig));
    if(r.sh.from) shape(r.orig,{color:GREY,fill:undefined,op:0,width:lw*.6,dash:[lw*2,lw*2]});
    shape(r.sh,{color:c,fill:c,op:.15,width:lw});
    if(r.ko&&r.o.real) shape(realShape(r.sh,r.o),{color:RED,fill:RED,op:.12,width:lw*1.1,dash:[lw*4,lw*2.5]});
  });
  /* écarts cotés */
  rows.forEach(function(r){
    if(!(r.ko&&r.o.real)) return;

    if(Math.abs(R.X-C.X)>=.005) arrow(a,m,RED,lw*.9);
    if(Math.abs(R.Y-C.Y)>=.005) arrow(m,b,RED,lw*.9);
    page.drawCircle({x:a.x,y:a.y,size:lw*1.3,color:RED});
  });
  /* noms des réservations conformes ou non contrôlées */
  rows.forEach(function(r){
    if(r.ko) return;
    var s=r.sh, tl=bu(s.t==="rect"?s.x:s.x-s.r, s.t==="rect"?s.y:s.y-s.r);
    var t=win(s.n+(s.from?" (repris de "+lvName(s.from)+")":"")), sz=Tz*.7, w=F.b.widthOfTextAtSize(t,sz)+pad, h=sz*1.3;
    var b={x:Math.min(Math.max(BX+BM,tl.x),BW-w-BM), y:Math.min(tl.y+lw,BH-h-BM), w:w, h:h};
    page.drawRectangle({x:b.x,y:b.y,width:b.w,height:b.h,color:WHITE,opacity:.8});
    page.drawText(t,{x:b.x+pad/2,y:b.y+sz*.3,size:sz,font:F.b,color:col(colOf(r.orig))});
    boxes.push(b);
  });
  /* étiquettes des anomalies */
  rows.forEach(function(r){
    if(!r.ko) return;
    var s=r.sh, o=r.o, rs=o.real?realShape(s,o):null, ec=rs?ecart(s,o):null;
    var lines=[{t:win(s.n+(ec?" — écart "+Math.round(ec.d*100)+" cm":" — anomalie")),b:1,s:Tz,c:RED}];
    if(ec) lines.push({t:win("X "+cm(ec.dx)+"   ·   Y "+cm(ec.dy)),b:1,s:Tz*.85,c:RED});
    else lines.push({t:win("position réelle non pointée"),s:Tz*.8,c:RED});
    if(rs&&dimsChanged(s,o)) lines.push({t:win("réel "+dimTxt(rs)+"  (prévu "+dimTxt(s)+")"),s:Tz*.8});
    if(o.c) wrap(o.c,F.r,Tz*.8,Tz*24).slice(0,3).forEach(function(t){ lines.push({t:t,s:Tz*.8}); });
    if(s.from) lines.push({t:win("position attendue reprise de "+lvName(s.from)),s:Tz*.72,c:GREY});
    var anchor=rs? bu(centerOf(rs).X,centerOf(rs).Y) : bu(centerOf(s).X,centerOf(s).Y);
    var px=ec&&ec.dx<0?-1:1, py=ec&&ec.dy>0?-1:1, mz=measure(lines);
    var b=place(mz.w,mz.h,anchor.x,anchor.y,px,py,Tz*2.5);

  });

}

/* formats ISO portrait, en points */
var PAPER_PT={a0:[2384,3370],a1:[1684,2384],a2:[1191,1684],a3:[842,1191],a4:[595,842]};
var EXP_MARGIN=8*72/25.4, PRINT_PT=9;
function paperFor(fmt,ori,W,H){
  if(fmt==="orig"||!PAPER_PT[fmt]) return null;
  var p=PAPER_PT[fmt], land= ori==="l" || (ori!=="p" && W>H);
  return {w:land?p[1]:p[0], h:land?p[0]:p[1], name:fmt.toUpperCase()+(land?" paysage":" portrait")};
}
function fitIn(t,W,H){ return Math.min((t.w-2*EXP_MARGIN)/W,(t.h-2*EXP_MARGIN)/H); }
/* taille de la page d'un niveau en points, avant export (le PDF garde sa rotation dans l'image de travail) */
function levelPt(l){ var k=l.pdf? 1/l.pdf.base : 72/150; return {W:l.w*k, H:l.h*k, k:k}; }
/* mise en page d'un niveau : échelle f de la page annotée sur la feuille, taille de texte, échelle imprimée */
function layoutFor(l,W,H,k,fmt,ori){
  var t0=paperFor(fmt,ori,W,H), f0=t0? fitIn(t0,W,H) : 1, Tz=PRINT_PT/f0, Ha=H+bandH(Tz);
  var t=paperFor(fmt,ori,W,Ha), f=t? fitIn(t,W,Ha) : 1;
  var N=1000/(cal(l).s*k*f*25.4/72);
  return {paper:t, f:f, Tz:Tz, Ha:Ha, N:N};
}
function ratioTxt(N){
  var std=[10,20,25,50,75,100,125,150,200,250,500,1000];
  for(var i=0;i<std.length;i++) if(Math.abs(N-std[i])/std[i]<.02) return "1/"+std[i];
  return "≈ 1/"+Math.round(N);
}
function exportPlans(fmt,ori,prog){
  var L=window.PDFLib;
  if(!L) return Promise.reject(new Error("module PDF non chargé"));
  var lvs=levelsUp(); if(!lvs.length) return Promise.reject(new Error("aucun niveau calé (échelle + repère)"));
  var tmp, F={}, cache=new Map(), title=S.title||"", lays=[];
  var chain=L.PDFDocument.create().then(function(d){ tmp=d;
    return Promise.all([tmp.embedFont(L.StandardFonts.Helvetica),tmp.embedFont(L.StandardFonts.HelveticaBold)]); })
    .then(function(f){ F.r=f[0]; F.b=f[1]; });
  lvs.forEach(function(l,i){ chain=chain.then(function(){
    prog("Plan "+(i+1)+" / "+lvs.length+" — "+l.name+"…");
    return levelPage(tmp,l,cache).then(function(info){
      var ly=layoutFor(l,info.Wd,info.Hd,info.k,fmt,ori);
      annotate(info,l,exportRows(l),F,title,ly.Tz,
        "Échelle à l'impression : "+ratioTxt(ly.N)+" — "+(ly.paper?ly.paper.name:"format d'origine")+", imprimer à 100 % (taille réelle)");
      lays.push({ly:ly, W:info.Wd});
    });
  }); });
  /* format choisi : chaque page annotée est posée, toujours en vectoriel, à l'échelle de la feuille */
  chain=chain.then(function(){
    if(fmt==="orig") return tmp;
    /* pdf-lib n'écrit les pages incorporées qu'à l'enregistrement : on finalise avant de les reposer */
    var done;
    return tmp.save().then(function(b){ return L.PDFDocument.load(b); }).then(function(d){ done=d; return L.PDFDocument.create(); }).then(function(out){
      var c=Promise.resolve();
      lays.forEach(function(p,i){ c=c.then(function(){
        return out.embedPage(done.getPage(i)).then(function(emb){
          var t=p.ly.paper, w=p.W*p.ly.f, h=p.ly.Ha*p.ly.f, pg=out.addPage([t.w,t.h]);
          pg.drawPage(emb,{x:(t.w-w)/2, y:(t.h-h)/2, width:w, height:h});
        });
      }); });
      return c.then(function(){ return out; });
    });
  });
  return chain.then(function(doc){ prog("Écriture du PDF…"); return doc.save(); }).then(function(bytes){
    var f=fname("Plans_"+(fmt==="orig"?"format-origine":fmt.toUpperCase())), a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"})); a.download=f;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },60000);
    return f;
  });
}

/* ============ export réservation par réservation : une page par réservation, ses niveaux zoomés côte à côte ============ */
var STD_N=[5,10,20,25,50,75,100,125,150,200,250,500,1000,2000];
function resList(koOnly){
  return S.shapes.filter(shown).map(function(sh){
    var lvs=levelsUp().filter(function(l){ return onLevel(sh,l.id); });
    return {sh:sh, lvs:lvs, kos:lvs.filter(function(l){ var o=obsOf(sh,l.id); return o&&o.st==="ko"; }).length};
  }).filter(function(r){ return r.lvs.length&&(!koOnly||r.kos); })
    .sort(function(a,b){ return String(a.sh.n||"").localeCompare(String(b.sh.n||""),"fr",{numeric:true}); });
}
/* emprise de la réservation sur un niveau (attendue, réelle, projet d'origine), en points du niveau, bas → haut */
function resBox(sh,l,base){
  var k=base.k, xs=[], ys=[], sa=at(sh,l.id), o=obsOf(sh,l.id), list=[sa];
  if(sa.from) list.push(sh);
  if(o&&o.st==="ko"&&o.real) list.push(realShape(sa,o));
  list.forEach(function(s){ corners(s).forEach(function(q){ var p=w2p(l,q[0],q[1]); xs.push(p.x*k); ys.push(base.Hd-p.y*k); }); });
  var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs), y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  return {cx:(x0+x1)/2, cy:(y0+y1)/2, w:x1-x0, h:y1-y0};
}
var RES_HEAD=62, RES_CAP=26, RES_GAP=10;
/* grille des vues sur la feuille : nombre de colonnes et échelle (pt de papier par mètre) donnant le plus grand zoom */
function resGrid(t,n,needW,needH){
  var aw=t.w-2*EXP_MARGIN, ah=t.h-2*EXP_MARGIN-RES_HEAD, best=null;
  for(var c=1;c<=n;c++){
    var r=Math.ceil(n/c), pw=(aw-(c-1)*RES_GAP)/c, ph=(ah-r*RES_CAP-(r-1)*RES_GAP)/r;
    if(pw<=0||ph<=0) continue;
    var s=Math.min(pw/needW,ph/needH);
    if(!best||s>best.s) best={c:c,r:r,pw:pw,ph:ph,s:s};
  }
  /* échelle ronde (1/20, 1/50…) juste en dessous du zoom maximal */
  var Nmin=72000/(25.4*best.s), N=STD_N.find(function(v){ return v>=Nmin*.999; })||Math.ceil(Nmin);
  best.N=N; best.s=72000/(25.4*N);
  return best;
}
function exportByRes(fmt,ori,koOnly,prog){
  var L=window.PDFLib;
  if(!L) return Promise.reject(new Error("module PDF non chargé"));
  if(!levelsUp().length) return Promise.reject(new Error("aucun niveau calé (échelle + repère)"));
  var list=resList(koOnly);
  if(!list.length) return Promise.reject(new Error(koOnly?"aucune réservation en anomalie":"aucune réservation sur les niveaux calés"));
  if(!PAPER_PT[fmt]) fmt="a3";
  var out, F={}, cache=new Map(), bases=new Map(), title=S.title||"";
  var GREY=L.rgb(.45,.45,.45), RED=L.rgb(.78,.16,.12), GREEN=L.rgb(.1,.5,.25), BLACK=L.rgb(0,0,0);
  function base(l){ if(!bases.has(l.id)) bases.set(l.id,levelBase(out,l,cache)); return bases.get(l.id); }
  function fitTxt(t,font,size,maxW){ t=win(t); while(t.length>1&&font.widthOfTextAtSize(t,size)>maxW) t=t.slice(0,-2)+"…"; return win(t); }
  var chain=L.PDFDocument.create().then(function(d){ out=d;
    return Promise.all([out.embedFont(L.StandardFonts.Helvetica),out.embedFont(L.StandardFonts.HelveticaBold)]); })
    .then(function(f){ F.r=f[0]; F.b=f[1]; });
  list.forEach(function(it,ri){ chain=chain.then(function(){
    var sh=it.sh, lvs=it.lvs;
    prog("Réservation "+(ri+1)+" / "+list.length+" — "+(sh.n||"")+"…");
    return Promise.all(lvs.map(base)).then(function(bs){
      /* même emprise réelle (en mètres) sur tous les niveaux, avec du plan autour pour se repérer */
      var boxes=lvs.map(function(l,i){ return resBox(sh,l,bs[i]); }), needW=0, needH=0;
      boxes.forEach(function(b,i){ var ppm=cal(lvs[i]).s*bs[i].k; needW=Math.max(needW,b.w/ppm); needH=Math.max(needH,b.h/ppm); });
      var marg=Math.max(1.5,.75*Math.max(needW,needH)); needW+=2*marg; needH+=2*marg;
      var t, g;
      if(ori==="auto"){
        var tp=paperFor(fmt,"p",1,1), tl=paperFor(fmt,"l",1,1), gp=resGrid(tp,lvs.length,needW,needH), gl=resGrid(tl,lvs.length,needW,needH);
        if(gl.s>=gp.s){ t=tl; g=gl; } else { t=tp; g=gp; }
      }else{ t=paperFor(fmt,ori,1,1); g=resGrid(t,lvs.length,needW,needH); }
      var page=out.addPage([t.w,t.h]), M=EXP_MARGIN, top=t.h-M;
      /* en-tête */
      var ly=layerOf(sh), ty=sh.ty&&typeOf(sh.ty);

      page.drawText(win((ri+1)+" / "+list.length),{x:t.w-M-F.r.widthOfTextAtSize(win((ri+1)+" / "+list.length),9),y:top-12,size:9,font:F.r,color:GREY});
      var l2=[sh.t==="rect"?"Rectangulaire":"Ronde",dimTxt(sh),ty?"objet "+ty.code:"",ly?"calque "+ly.name:"",
        lvs.length+" niveau"+(lvs.length>1?"x":"")+" : "+lvs.map(function(l){ return l.name; }).join(", "),
        it.kos?it.kos+" anomalie"+(it.kos>1?"s":""):"aucune anomalie"].filter(Boolean).join("  ·  ");
      page.drawText(fitTxt(l2,F.b,9,t.w-2*M),{x:M,y:top-29,size:9,font:F.b,color:it.kos?RED:BLACK});
      page.drawText(fitTxt([title,today(),"Échelle à l'impression : "+ratioTxt(g.N)+" — "+t.name+", imprimer à 100 % (taille réelle)"].filter(Boolean).join("  ·  "),F.r,8.5,t.w-2*M),
        {x:M,y:top-42,size:8.5,font:F.r,color:BLACK});
      page.drawText(win("Seule cette réservation est affichée  ·  Trait plein : position attendue  ·  Pointillé rouge : position réelle  ·  Écart X + vers la droite, Y + vers le bas du plan"),
        {x:M,y:top-54,size:7.5,font:F.r,color:GREY});
      /* une vue par niveau, de gauche à droite du bas vers le haut du bâtiment */
      lvs.forEach(function(l,i){
        var b=bs[i], bx=boxes[i], ppm=cal(l).s*b.k, f=g.s/ppm;
        var col=i%g.c, row=Math.floor(i/g.c);
        var px=M+col*(g.pw+RES_GAP), yTop=top-RES_HEAD-row*(RES_CAP+g.ph+RES_GAP), py=yTop-RES_CAP-g.ph;
        var cw=g.pw/f, ch=g.ph/f, wx=bx.cx-cw/2, wy=bx.cy-ch/2;
        /* légende de la vue */
        var o=obsOf(sh,l.id), sa=at(sh,l.id), ec=o&&o.st==="ko"? ecart(sa,o) : null;
        var st= o&&o.st==="ko"? (ec?"Anomalie — écart "+Math.round(ec.d*100)+" cm (X "+cm(ec.dx)+", Y "+cm(ec.dy)+")":"Anomalie — position réelle non pointée")
              : o&&o.st==="ok"? "Conforme" : "Non contrôlée";
        if(sa.from) st+="  ·  position reprise de "+lvName(sa.from);
        page.drawText(fitTxt(l.name,F.b,10.5,g.pw),{x:px,y:yTop-11,size:10.5,font:F.b,color:BLACK});
        page.drawText(fitTxt(st,F.r,8,g.pw),{x:px,y:yTop-22,size:8,font:F.r,color:o&&o.st==="ko"?RED:o&&o.st==="ok"?GREEN:GREY});
        /* plan d'origine recadré, zoomé, avec la seule réservation annotée */
        page.pushOperators(L.pushGraphicsState(), L.rectangle(px,py,g.pw,g.ph), L.clip(), L.endPath(),
          L.concatTransformationMatrix(f,0,0,f,px-wx*f,py-wy*f));
        b.draw(page);
        var rows=exportRows(l).filter(function(r){ return r.orig===sh; });
        annotate({page:page,Wd:b.Wd,Hd:b.Hd,k:b.k},l,rows,F,title,PRINT_PT/f,"",{clip:{x:wx,y:wy,w:cw,h:ch}});
        page.pushOperators(L.popGraphicsState());
        page.drawRectangle({x:px,y:py,width:g.pw,height:g.ph,borderColor:GREY,borderWidth:.6});
      });
    });
  }); });
  return chain.then(function(){ prog("Écriture du PDF…"); return out.save(); }).then(function(bytes){
    var f=fname("Reservations_"+fmt.toUpperCase()), a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"})); a.download=f;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },60000);
    return f;
  });
}
