<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Report &amp; métré</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c8492a">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
/* Mise en page : barre d'outils en haut, panneaux latéraux, scène sombre au centre (le plan reste une feuille blanche) */
:root{
  --bg:#e9ecf1; --panel:#ffffff; --panel-2:#f4f6f9; --ink:#161a21; --muted:#5d6675;
  --line:#d6dbe3; --line-soft:#e7eaf0;
  --accent:#c8492a; --accent-soft:rgba(200,73,42,.11);
  --blue:#1f6f8b; --blue-soft:rgba(31,111,139,.13);
  --ok:#2d7a4f; --warn:#9d7312; --bad:#d8352a;
  --stage:#22272f; --stage-grid:rgba(255,255,255,.07);
  --glass:rgba(24,28,35,.82); --glass-line:rgba(255,255,255,.12); --glass-ink:#d5dce6;
  --shadow:0 16px 44px rgba(16,20,28,.22);
  --f-ui:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-num:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --panel:#1a1e25; --panel-2:#20252d; --ink:#e7eaf0; --muted:#98a1b0;
  --line:#2c323c; --line-soft:#242931;
  --accent:#ef7047; --accent-soft:rgba(239,112,71,.15);
  --blue:#56b2cf; --blue-soft:rgba(86,178,207,.15);
  --ok:#5cb281; --warn:#d6a53c; --bad:#ef5b4f;
  --stage:#0e1115; --stage-grid:rgba(255,255,255,.06);
  --shadow:0 16px 44px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111418; --panel:#1a1e25; --panel-2:#20252d; --ink:#e7eaf0; --muted:#98a1b0;
  --line:#2c323c; --line-soft:#242931;
  --accent:#ef7047; --accent-soft:rgba(239,112,71,.15);
  --blue:#56b2cf; --blue-soft:rgba(86,178,207,.15);
  --ok:#5cb281; --warn:#d6a53c; --bad:#ef5b4f;
  --stage:#0e1115; --stage-grid:rgba(255,255,255,.06);
  --shadow:0 16px 44px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.i{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:15px;height:15px}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* ---------- barre du haut ---------- */
.top{display:flex;align-items:center;gap:10px;min-width:0;background:var(--panel);border-bottom:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.logo .i{width:18px;height:18px;stroke-width:2}
.brand b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.brand small{display:block;font-family:var(--f-num);font-size:9.5px;color:var(--muted);letter-spacing:.06em}
.proj{display:flex;align-items:center;gap:7px;min-width:0;max-width:230px;border:1px solid var(--line);background:var(--panel-2);
  border-radius:8px;padding:6px 8px 6px 9px;font-size:13px;font-weight:600;flex:none}
.proj span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj:hover{border-color:var(--muted)}
.proj .i{color:var(--muted)}
.tbar{display:flex;align-items:flex-end;gap:5px;min-width:0;overflow-x:auto;scrollbar-width:none;flex:0 1 auto}
.tbar::-webkit-scrollbar{display:none}
.grp{display:flex;align-items:center;gap:1px;padding-right:5px;border-right:1px solid var(--line-soft);flex:none;position:relative}
.grp:last-child{border-right:0}
/* titre de chaque groupe d'outils (écrans larges) */
@media (min-width:1241px){
  .tbar .grp{padding-top:13px}
  .tbar .grp::before{content:attr(data-cap);position:absolute;top:0;left:5px;font-size:8.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);opacity:.8;white-space:nowrap}
  .tbar .tool{height:40px}
}
/* objet des nouvelles réservations : calque › objet */
.objchip{display:flex;align-items:center;gap:7px;height:40px;margin-left:4px;padding:0 7px 0 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);max-width:156px;flex:none;text-align:left;color:var(--ink)}
.objchip:hover{border-color:var(--muted)}
.objchip.pose{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.objchip .sw{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.objchip .oc{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.objchip b{font-family:var(--f-num);font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.objchip small{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:118px}
.objchip .i{color:var(--muted)}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:50px;height:44px;padding:3px 5px;
  border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:10.5px;font-weight:500;white-space:nowrap;flex:none}
.tool:hover{background:var(--panel-2);color:var(--ink)}
.tool.on{background:var(--accent);color:#fff}
.tool.on.mt{background:var(--blue)}
.sp{flex:1 1 0;min-width:0}
.acts{display:flex;align-items:center;gap:3px;flex:none}
.ib{width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;border-radius:8px;color:var(--muted);flex:none;padding:0}
.ib:hover{background:var(--panel-2);color:var(--ink)}
.ib.on{color:var(--blue);background:var(--blue-soft)}
.ib[disabled]{opacity:.32;pointer-events:none}
.vsep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}

/* poignées de redimensionnement des panneaux */
.vsplit{position:absolute;width:10px;cursor:col-resize;z-index:6;touch-action:none}
.hsplit{position:relative;flex:none;height:8px;margin:-9px 0;cursor:row-resize;z-index:6;touch-action:none}
.vsplit::after,.hsplit::after{content:"";position:absolute;border-radius:2px;background:var(--blue);opacity:0;transition:opacity .12s}
.vsplit::after{left:4px;top:0;bottom:0;width:2px}
.hsplit::after{top:3px;left:0;right:0;height:2px}
.vsplit:hover::after,.vsplit.on::after,.hsplit:hover::after,.hsplit.on::after{opacity:.8}
#main{position:relative;min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr) 300px;gap:10px;
  padding:10px max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}

/* ---------- panneaux ---------- */
.side{min-width:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0}
.card > header{display:flex;align-items:center;gap:5px;padding:7px 7px 7px 11px;border-bottom:1px solid var(--line-soft);min-height:42px}
.card > header h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card > header .sp{margin-left:auto}
.scroll{overflow:auto;min-height:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:6px 11px;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:5px 7px}
.btn.ghost:hover{color:var(--ink);background:var(--panel-2)}
.btn.sm{padding:3px 8px;font-size:11.5px;border-radius:6px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.42;pointer-events:none}

/* ---------- niveaux ---------- */
.lvl{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:9px;align-items:center;padding:7px 9px 7px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.lvl:last-child{border-bottom:0}
.lvl:hover{background:var(--panel-2)}
.lvl.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.lvl .th{width:36px;height:27px;border:1px solid var(--line);border-radius:4px;background:#fff center/contain no-repeat;flex:none}
.lvl .nm{min-width:0}
.lvl .nm input{width:100%;background:transparent;border:0;padding:0;font-size:13px;font-weight:600;letter-spacing:-.005em}
.lvl .nm input:focus{outline:0;border-bottom:1px solid var(--blue)}
.lvl .meta{font-family:var(--f-num);font-size:10px;color:var(--muted);margin-top:3px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tag{font-family:var(--f-num);font-size:9.5px;letter-spacing:.03em;padding:1px 5px;border-radius:4px;border:0;background:transparent;text-transform:uppercase}
.tag.warn{background:var(--accent-soft);color:var(--accent)}
.tag.ok{color:var(--ok);background:transparent;padding-left:0}
button.tag:hover{text-decoration:underline}
.ord{display:flex;flex-direction:column;gap:1px}
.ord button{border:0;background:transparent;color:var(--muted);line-height:1;padding:2px 4px;font-size:10px;border-radius:4px}
.ord button:hover{color:var(--ink);background:var(--panel-2)}

/* ---------- réservations ---------- */
.res{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:9px;align-items:center;padding:6px 8px 6px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.res:last-child{border-bottom:0}
.res:hover{background:var(--panel-2)}
.res.on{background:var(--blue-soft);box-shadow:inset 3px 0 0 var(--blue)}
.swatch{width:10px;height:10px;border-radius:3px}
.res .nm{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .dim{font-family:var(--f-num);font-size:10.5px;color:var(--muted)}
.res .q{font-family:var(--f-num);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bad{font-family:var(--f-num);font-size:9.5px;color:#fff;background:var(--bad);border-radius:4px;padding:1px 4px;vertical-align:1px}
.st{display:flex;gap:4px}
.st button{flex:1;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:5px;font-size:12px;color:var(--muted)}
.st button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.st button.ko{background:var(--bad);border-color:var(--bad);color:#fff}
.empty{padding:14px 12px;color:var(--muted);font-size:12.5px;line-height:1.5}

/* ---------- arbre calques › objets › réservations, postes de métré ---------- */
.ly{display:grid;grid-template-columns:18px 22px 14px minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:5px 6px;border-bottom:1px solid var(--line-soft);background:var(--panel-2);cursor:pointer}
.ly.on{box-shadow:inset 3px 0 0 var(--accent)}
.ly .chev,.ly .eye,.ly .mn{border:0;background:transparent;color:var(--muted);padding:0;height:22px;min-width:20px;display:grid;place-items:center;border-radius:4px;font-size:10px}
.ly .mn{font-size:14px;letter-spacing:1px;line-height:1}
.ly .chev:hover,.ly .eye:hover,.ly .mn:hover{color:var(--ink);background:var(--line-soft)}
.ly .lsw{width:14px;height:14px;border-radius:4px;position:relative;overflow:hidden;cursor:pointer}
.ly .lsw input{position:absolute;inset:-4px;width:24px;height:24px;opacity:0;cursor:pointer;border:0;padding:0}
.ly .lnm{width:100%;min-width:0;background:transparent;border:0;padding:0;font-size:12.5px;font-weight:600}
.ly .lnm:focus{outline:0;border-bottom:1px solid var(--blue)}
.ly .cnt{font-family:var(--f-num);font-size:10px;color:var(--muted);display:flex;gap:5px;align-items:center}
.ly.off .lnm,.ly.off .lsw,.ly.off .cnt,.ly.off .code,.ly.off .lbl{opacity:.45}
/* calque */
.ly.cal{grid-template-columns:18px 22px minmax(0,1fr) auto auto auto;background:var(--panel-2)}
.ly.cal .lnm{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.ly.cal .add{border:1px solid var(--line);background:var(--panel);border-radius:5px;height:20px;min-width:20px;padding:0 5px;font-size:11px;color:var(--muted)}
.ly.cal .add:hover{color:var(--ink);border-color:var(--muted)}
/* objet (type de réservation) */
.ly.ob{grid-template-columns:18px 22px 14px 46px minmax(0,1fr) auto auto;padding-left:14px;background:var(--panel)}
.ly.ob:hover{background:var(--panel-2)}
.ly.ob.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.ly.ob.pose .code::after{content:" ●";color:var(--accent)}
.ob .code{width:100%;min-width:0;background:transparent;border:0;padding:0;font-family:var(--f-num);font-size:12.5px;font-weight:600}
.ob .code:focus{outline:0;border-bottom:1px solid var(--blue)}
.ob .lbl{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:8px 10px 9px 52px;border-bottom:1px solid var(--line-soft);background:var(--panel)}
.obed .full{grid-column:1/-1}
#rsList .res.sub{padding-left:52px}
#rsList .res.none.l1{padding-left:34px}
/* postes de métré */
.it{grid-template-columns:18px 22px 14px minmax(0,1fr) auto auto}
.it.on{background:var(--blue-soft);box-shadow:inset 3px 0 0 var(--blue)}
.it .tot{font-family:var(--f-num);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.it .kd{color:var(--muted);display:grid;place-items:center}
.sub2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:4px 10px 4px 42px;border-bottom:1px solid var(--line-soft);font-size:11.5px;color:var(--muted)}
.sub2 b{font-family:var(--f-num);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.sub2.cur{color:var(--ink)}
.mtfoot{display:flex;justify-content:space-between;gap:8px;padding:9px 11px;border-top:1px solid var(--line);font-size:12px;background:var(--panel)}
.mtfoot b{font-family:var(--f-num)}
.card header .seg{padding:2px;gap:2px}
.card header .seg button{flex:none;padding:3px 8px;font-size:11.5px}
.inh{margin:0;font-size:11.5px;color:var(--blue);line-height:1.4}
.dvb{border-top:1px dashed var(--line);padding-top:9px}
.dvn{margin:0;font-family:var(--f-num);font-size:11px;color:var(--blue)}
.res.sub{padding-left:30px}
.res.hide{opacity:.45}
.res .ra{display:flex;align-items:center}
.res .ra [data-eye]{padding:3px 4px;opacity:.55}
.res:hover .ra [data-eye],.res.hide .ra [data-eye]{opacity:1}
.hidbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:6px 8px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line-soft);background:var(--panel-2)}
.hidbar span{flex:1 1 auto;min-width:0}
.hidbar span:empty{display:none}
.hidbar [data-show]{margin-left:auto}
.res.none{cursor:default;color:var(--muted);font-size:11.5px;font-style:italic}

#cardLv{flex:0 1 auto;max-height:42%}
#cardLy{flex:1 1 auto;min-height:150px}
#cardPr{flex:0 1 auto;max-height:100%}
#insp{min-height:0;overflow:auto}

/* ---------- inspecteur ---------- */
.insp{padding:10px 11px;display:flex;flex-direction:column;gap:9px}
.insp .acts{display:flex;gap:6px;position:sticky;top:0;margin:-10px -11px 0;padding:8px 11px;background:var(--panel);z-index:1;border-bottom:1px solid var(--line-soft)}
.insp .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.insp .big{display:flex;align-items:baseline;gap:8px;padding:9px 10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line-soft)}
.insp .big b{font-family:var(--f-num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.insp .big span{color:var(--muted);font-size:12px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-family:var(--f-num);font-size:12.5px;font-variant-numeric:tabular-nums}
.fld input[type=text],.fld textarea{font-family:var(--f-ui);font-size:13px}
.fld input[type=checkbox]{width:auto;flex:none}
.picks{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);margin-top:5px}
.picks .grp{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px 3px;display:flex;gap:6px;align-items:center}
.picks label{display:flex;gap:7px;align-items:center;padding:3px 8px 3px 14px;font-size:12.5px;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--ink)}
.picks label:hover{background:var(--line-soft)}
.picks input[type=checkbox]{width:auto;margin:0}
.ck{display:flex;gap:7px;align-items:center;font-size:12px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--muted)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.qk{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.qk button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:3px 7px;font-size:11px;color:var(--muted)}
.qk button:hover{color:var(--ink);border-color:var(--muted)}
.seg{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:5px;padding:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--blue);color:#fff}

/* propriétés : sections titrées */
.insp .sec{border-top:1px solid var(--line-soft);padding-top:10px;margin-top:1px;display:flex;flex-direction:column;gap:7px}
.insp .sec > h4{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.insp .sec > h4 .swatch{width:9px;height:9px}
.insp .hd{display:flex;align-items:center;gap:9px}
.insp .hd .swatch{width:14px;height:14px;border-radius:4px;flex:none}
.insp .hd b{font-size:15px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insp .hd small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.mut{margin:0;font-size:11.5px;color:var(--muted);line-height:1.45}

/* ---------- vues : barre de disposition + scène ---------- */
.center{min-width:0;min-height:0;display:flex;flex-direction:column}
.vbar{display:flex;align-items:center;gap:6px;padding:5px 6px;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;
  min-width:0;overflow-x:auto;scrollbar-width:none;flex:none}
.vbar::-webkit-scrollbar{display:none}
.vgrp{display:flex;align-items:center;gap:1px;flex:none}
.vgrp button,.vb{border:0;background:transparent;color:var(--muted);border-radius:6px;height:30px;min-width:30px;padding:0 7px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;flex:none;white-space:nowrap}
.vgrp button:hover,.vb:hover{background:var(--panel-2);color:var(--ink)}
.vgrp button.on,.vb.on{background:var(--blue-soft);color:var(--blue)}
.vgrp button[disabled]{opacity:.35;pointer-events:none}
.vbar .zv{font-family:var(--f-num);font-size:11px;min-width:62px}
.vbar .vsep{height:20px}
.lay{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px;flex:none}
.lay button{border:0;background:transparent;color:var(--muted);border-radius:6px;height:28px;min-width:30px;padding:0 6px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;white-space:nowrap}
.lay button:hover{color:var(--ink);background:var(--panel)}
.lay button.on{background:var(--accent);color:#fff}
#nav .nm{font-size:12px;font-weight:600;padding:0 4px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.und{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;padding:0 4px;flex:none}
.und select{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;font-size:12px;max-width:110px;padding:3px 4px}
.und input[type=range]{width:64px;accent-color:var(--accent)}
.und.off{opacity:.4;pointer-events:none}
.stage{position:relative;flex:1 1 auto;min-width:0;min-height:0;border:1px solid var(--line);border-radius:0 0 var(--r) var(--r);overflow:hidden;background:var(--stage)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.gl{display:flex;align-items:center;gap:2px;background:var(--glass);border:1px solid var(--glass-line);border-radius:9px;padding:3px;color:var(--glass-ink);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
/* en-tête de chaque vue : contenu (niveau ou élévation), vue liée, recadrer */
#pheads{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.phead{position:absolute;display:flex;align-items:center;gap:1px;background:var(--glass);border:1px solid var(--glass-line);border-radius:8px;padding:2px;color:var(--glass-ink);
  pointer-events:auto;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:calc(100% - 12px);font-size:12px}
.phead.on{background:var(--accent);border-color:var(--accent);color:#fff}
.phead select{background:transparent;border:0;color:inherit;font-weight:600;font-size:12px;max-width:150px;padding:3px 2px 3px 5px;cursor:pointer}
.phead select option{color:var(--ink);background:var(--panel);font-weight:500}
.phead .nm{font-weight:600;padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .why{opacity:.8;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.phead .warn{color:#ffb39c;font-size:11px;padding:0 6px;white-space:nowrap}
.phead.on .warn{color:#fff}
.phead button{border:0;background:transparent;color:inherit;border-radius:5px;height:24px;min-width:24px;padding:0 5px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;opacity:.75}
.phead button:hover{background:rgba(255,255,255,.16);opacity:1}
.phead button.on{background:rgba(255,255,255,.24);opacity:1}
.phead .i{width:14px;height:14px}
.pdiv{position:absolute;z-index:3;touch-action:none;border-radius:3px}
.pdiv.v{cursor:col-resize}
.pdiv.h{cursor:row-resize}
.pdiv:hover,.pdiv.on{background:rgba(86,178,207,.55)}
/* hauteurs d'étage */
.hts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
.hts .hl{display:grid;grid-template-columns:minmax(0,1fr) 78px auto;gap:10px;align-items:center;padding:7px 10px;background:var(--panel)}
.hts .hl b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hts .hl .al{font-family:var(--f-num);font-size:12px;text-align:right}
.hts .hl label{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);cursor:pointer;white-space:nowrap}
.hts .hh{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 22px;background:var(--panel-2);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);font-size:11.5px;color:var(--muted)}
.hts .hh input{width:74px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-family:var(--f-num);font-size:12px}
.tag.alt{color:var(--blue);background:transparent;padding-left:0;text-transform:none}
.status{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px 16px;flex-wrap:wrap;padding:7px 11px;
  font-family:var(--f-num);font-size:10.5px;color:#9aa5b4;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.6));font-variant-numeric:tabular-nums;pointer-events:none}
.status span{white-space:nowrap}
.status b{color:#e7ecf3;font-weight:500}

/* fenêtres */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,13,18,.46);display:grid;place-items:center;padding:14px}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 28px));max-height:calc(100% - 28px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);z-index:5}
.modal .sheet{position:relative;left:auto;top:auto;transform:none;width:min(480px,100%);max-height:calc(100vh - 28px)}
.modal .sheet.wide{width:min(640px,100%)}
.sheet h3{margin:0 0 6px;font-size:15px}
.sheet p{margin:0 0 11px;color:var(--muted);font-size:12.5px;line-height:1.5}
.sheet .acts{display:flex;gap:7px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.sheet textarea{width:100%;height:120px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px;font-family:var(--f-num);font-size:11px;resize:vertical}
.sheet .x{position:absolute;top:10px;right:10px}

/* projets */
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:4px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px 9px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--panel-2)}
.prow.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.prow b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow small{display:block;font-family:var(--f-num);font-size:10.5px;color:var(--muted);margin-top:2px}
.prow input{width:100%;font-size:13.5px;font-weight:600;border:1px solid var(--blue);border-radius:5px;padding:3px 6px;background:var(--panel)}

/* aide des raccourcis */
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px;font-size:12.5px}
.keys h4{grid-column:1/-1;margin:10px 0 2px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.keys div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line-soft)}
kbd{font-family:var(--f-num);font-size:10.5px;background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;white-space:nowrap;color:var(--ink)}

/* menu contextuel */
.menu{position:fixed;z-index:60;min-width:220px;max-width:290px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;font-size:13px}
.menu button{display:flex;width:100%;align-items:center;gap:9px;border:0;background:transparent;padding:6px 9px;border-radius:6px;text-align:left;color:var(--ink)}
.menu button:hover,.menu button:focus-visible{background:var(--panel-2);outline:0}
.menu button[disabled]{opacity:.4;pointer-events:none}
.menu button .i{color:var(--muted);width:16px;height:16px}
.menu kbd{margin-left:auto}
.menu .h{padding:6px 9px 3px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu hr{border:0;border-top:1px solid var(--line-soft);margin:4px 3px}
.menu .dg{color:var(--bad)}
.menu .dg .i{color:var(--bad)}
.menu .on::after{content:"✓";margin-left:auto;color:var(--blue);font-weight:700}
.menu{max-height:calc(100vh - 12px);overflow:auto}
.menu .msw{width:12px;height:12px;border-radius:3px;flex:none;margin:0 2px}
.menu .sub{color:var(--muted);font-size:11.5px;margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.menu button > span:not(.msw):not(.sub){white-space:nowrap}

.hint{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);background:var(--accent);color:#fff;
  padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:4;max-width:92%;text-align:center}
.hint.live.mt{background:var(--blue)}
.hint kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:#fff}

.drop{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:9px;text-align:center;padding:24px;color:#aab3c0}
.drop h3{margin:0;color:#eef1f5;font-size:20px;font-weight:600;letter-spacing:-.01em}
.drop p{margin:0;max-width:44ch;line-height:1.55;font-size:13px}
.drop .acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.steps{display:grid;gap:5px;margin-top:12px;text-align:left;font-family:var(--f-num);font-size:11.5px;color:#8d97a4}
.steps span b{color:#c8d1dc;font-weight:500}

.dock{position:absolute;left:10px;bottom:36px;width:280px;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:12px;box-shadow:var(--shadow);z-index:6;display:flex;flex-direction:column;gap:8px}
.dock .dh{display:flex;align-items:center;gap:6px}
.dock .dh b{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .dp{margin:0;font-family:var(--f-num);font-size:11px;color:var(--muted);line-height:1.45}
.dock .row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dock .ck{color:var(--muted);margin-top:7px}
.dock #pL,.dock #pR{display:flex;flex-direction:column;gap:7px}
.tabs{display:none}

/* écrans moyens : outils sans libellé */
@media (max-width:1640px){ .brand div{display:none} .proj{max-width:190px} .tool{min-width:44px} }
@media (max-width:1240px){
  .tool{min-width:36px;height:36px;padding:0 6px}
  .tool span{display:none}
  .proj{max-width:170px}
  .objchip{height:36px}
  .objchip small{display:none}
  .und span{display:none}
}
@media (max-width:1100px){ .lay button span{display:none} }
/* téléphone / tablette en portrait */
@media (max-width:900px){
  .top{flex-wrap:wrap;gap:6px 8px;padding-top:max(6px,env(safe-area-inset-top,0px))}
  .proj{flex:1 1 auto;max-width:none}
  .tbar{order:5;flex:1 1 100%;padding-bottom:1px}
  .tool{min-width:52px;height:44px}
  .tool span{display:block}
  .panes,.top .vsep.pn{display:none!important}
  #main{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(260px,1fr) auto auto;gap:8px;padding-top:8px}
  .center{grid-row:1}
  .vbar{padding:4px}
  .objchip{max-width:120px}
  .tabs{grid-row:2;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px}
  .tabs button{flex:1;border:0;background:transparent;border-radius:6px;padding:7px 4px;font-size:12.5px;color:var(--muted);font-weight:500}
  .tabs button.on{background:var(--accent);color:#fff}
  .side{grid-row:3;max-height:40vh}
  .side .card{max-height:none!important}
  [data-hide]{display:none!important}
  .vsplit,.hsplit{display:none!important}
  #cardLv{height:auto!important}
  #themeBtn,#helpBtn,#lstSeg [data-v=mt]{display:none!important}
  .menu kbd{display:none}
  .menu button{padding:9px 10px}
  #repBtn{padding:7px 9px}
  #repBtn span{display:none}
  .acts{gap:1px}
  .dock{left:10px;right:10px;width:auto}
  .vbar .zv{min-width:44px}
}
</style>

<script>
(function(){
"use strict";
try{ if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}

/* ============ état ============ */
var S={ levels:[], shapes:[], activeId:null, selId:null, tool:"select",
        view:{s:1,tx:0,ty:0}, under:"", underOp:.45, grid:false, seq:1,
        asc:true,            /* true : le 1er de la liste est le niveau le plus bas */
        title:"", layers:[], activeLayer:null, types:undefined, activeType:null, ui:{lv:true,ly:true,pr:true,lst:"ly",exp:{fmt:"orig",ori:"auto"}},
        items:[], meas:[], activeItem:null, selM:null, expOff:[], msel:[], multiOff:[],
        hEt:2.8, zRef:null };   /* hauteur d'étage par défaut (m), niveau à ±0,00 */
/* couleurs des calques et objets : pas de rouge, réservé à la position réelle des anomalies */
var PAL=["#1f6f8b","#2d7a4f","#8a5bbf","#9d7312","#1f8b7e","#4a6fd1"];
var cv=document.getElementById("cv"), ctx=cv.getContext("2d"), dpr=1;
var stage=document.getElementById("stage");
var calLine=null;   // ligne de cote tracée pour l'échelle (px plan)
var meas=null;      // mesure en cours / affichée
var drag=null;      // interaction en cours
var cursor=null;
var booting=true;
var mobQ=window.matchMedia("(max-width:900px)"), mobTab="ly";

function uid(){ return Math.random().toString(36).slice(2,9); }
function active(){ return S.levels.find(function(l){return l.id===S.activeId;})||null; }
function sel(){ return S.shapes.find(function(s){return s.id===S.selId;})||null; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function fmt(v,d){ return (Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toFixed(d); }

/* ============ calques › objets › réservations ============ */
/* un calque range des objets (et se masque d'un coup) ; un objet est un type de réservation (GT, EU, VH…) avec
   sa forme, ses cotes et sa couleur ; chaque réservation est un objet, rangée dans le calque de cet objet.
   Par défaut : le calque « Calque par défaut » et l'objet RÉS. */
function layerOf(sh){ return S.layers.find(function(l){ return l.id===sh.ly; })||null; }
function colOf(sh){ var t=sh.ty&&typeOf(sh.ty); if(t) return t.c; var l=layerOf(sh); return l? l.c : (sh.c||PAL[0]); }
function typeOf(id){ return (S.types||[]).find(function(t){ return t.id===id; })||null; }
function layerById(id){ return S.layers.find(function(l){ return l.id===id; })||null; }
function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function typeDim(t){ return t.t==="rect"? Math.round(t.w*100)+"×"+Math.round(t.h*100)+" cm" : "Ø"+Math.round(t.r*200)+" cm"; }
function typeLbl(t){ return t.code+(t.name?" · "+t.name:""); }
function newType(o){
  var n=S.types.length, L0=S.layers[0]&&S.layers[0].id;
  var t=Object.assign({id:uid(), code:"OBJ"+(n+1), name:"", t:"rect", w:.5, h:.5, r:.1, c:PAL[(n+2)%PAL.length], ly:S.activeLayer||L0, vis:true, open:false},o||{});
  S.types.push(t); return t;
}
/* objet par défaut d'un calque : son RÉS (créé au besoin) */
function defType(lyId){
  var L=layerById(lyId)||S.layers[0];
  return S.types.find(function(t){ return t.ly===L.id&&/^RÉS$/i.test(t.code); })||newType({code:"RÉS",name:"Réservation",c:L.c||PAL[5],ly:L.id});
}
function fixTypes(){
  var fresh=!Array.isArray(S.types), L0=S.layers[0].id;
  if(fresh) S.types=[];
  S.types=S.types.filter(function(t){ return t&&t.id; });
  S.types.forEach(function(t){
    if(!/^#[0-9a-f]{6}$/i.test(t.c||"")) t.c=PAL[0];
    t.code=String(t.code||"OBJ"); t.name=String(t.name||""); if(t.t!=="circle") t.t="rect";
    if(t.t==="rect"){ if(!(t.w>0)) t.w=.5; if(!(t.h>0)) t.h=.5; } else if(!(t.r>0)) t.r=.1;
    if(!layerById(t.ly)) t.ly=L0;
  });
  /* projet neuf : l'objet par défaut RÉS et trois objets courants */
  if(fresh) [{code:"RÉS",name:"Réservation",t:"rect",w:.5,h:.5,c:PAL[5]},{code:"GT",name:"Gaine technique",t:"rect",w:.6,h:.4,c:PAL[0]},
    {code:"VH",name:"Ventilation haute",t:"circle",r:.1,c:PAL[1]},{code:"VB",name:"Ventilation basse",t:"circle",r:.1,c:PAL[3]}]
    .forEach(function(d){ d.ly=L0; newType(d); });
  /* réservation sans objet (projets d'avant) : objet tiré de son nom (« GT 3 » → GT), sinon RÉS, dans son calque, à sa couleur */
  S.shapes.forEach(function(s){
    if(s.ty&&typeOf(s.ty)) return;
    var L=layerById(s.ly)||S.layers[0], m=String(s.n||"").trim().match(/^(.*\S)\s+\d+$/), code=m? m[1] : "RÉS";
    var t=S.types.find(function(x){ return x.ly===L.id&&x.code.toLowerCase()===code.toLowerCase(); });
    if(!t) t= /^RÉS$/i.test(code)? defType(L.id)
      : newType({code:code, name:"", t:s.t==="circle"?"circle":"rect", w:s.t==="rect"?s.w:.5, h:s.t==="rect"?s.h:.5, r:s.t==="circle"?s.r:.1, c:L.c, ly:L.id});
    s.ty=t.id;
  });
  if(!S.types.length) defType(L0);
  S.shapes.forEach(function(s){ s.ly=typeOf(s.ty).ly; });
  if(!typeOf(S.activeType)) S.activeType=(S.types.find(function(t){ return t.ly===S.activeLayer; })||S.types[0]).id;
  S.activeLayer=typeOf(S.activeType).ly;
}
function activeObj(){ return typeOf(S.activeType)||S.types[0]; }
/* objet des nouvelles réservations (dessin au rectangle / rond, pose) */
function setActiveType(id,quiet){
  var t=typeOf(id); if(!t) return;
  S.activeType=t.id; S.activeLayer=t.ly;
  if(S.tool==="stamp"&&objId&&objId!==t.id){ objId=t.id; stampHint(); }
  renderObjChip(); if(!quiet){ renderShapes(); save(); }
}
/* l'objet (et son calque) redevient visible quand on y ajoute une réservation */
function showObj(t){ var L=layerById(t.ly); if(L){ L.vis=true; L.open=true; } t.vis=true; t.open=true; }
/* changement d'objet : la réservation suit le calque de l'objet ; « GT 3 » devient « VH n », un nom personnalisé reste */
function setObj(list,t){
  list.forEach(function(s){
    var old=typeOf(s.ty);
    if(old&&old!==t&&new RegExp("^"+escRe(old.code)+"\\s+\\d+$","i").test(String(s.n).trim())) s.n=typeName(t.code);
    s.ty=t.id; s.ly=t.ly;
  });
  showObj(t); renderAll(); save();
}
function typeOptions(cur,extra){
  return S.layers.map(function(L){
    var ts=S.types.filter(function(t){ return t.ly===L.id; }); if(!ts.length) return "";
    return '<optgroup label="'+esc(L.name)+'">'+ts.map(function(t){ return '<option value="'+t.id+'"'+(t.id===cur?" selected":"")+'>'+esc(typeLbl(t))+'</option>'; }).join("")+'</optgroup>';
  }).join("")+(extra||"");
}
/* bouton « objet actif » de la barre d'outils */
function renderObjChip(){
  var t=activeObj(), L=t&&layerById(t.ly), b=document.getElementById("objBtn"); if(!b||!t) return;
  document.getElementById("objSw").style.background=t.c;
  document.getElementById("objCode").textContent=t.code;
  document.getElementById("objLy").textContent=(L?L.name:"")+" · "+typeDim(t);
  b.classList.toggle("pose",S.tool==="stamp"&&objId===t.id);
}
function objMenu(){
  var b=document.getElementById("objBtn").getBoundingClientRect(), cur=activeObj(), it=[{h:"Objet des nouvelles réservations"}];
  S.layers.forEach(function(L){
    var ts=S.types.filter(function(t){ return t.ly===L.id; }); if(!ts.length) return;
    it.push({h:L.name});
    ts.forEach(function(t){ it.push({t:t.code, sub:(t.name?t.name+" · ":"")+typeDim(t), sw:t.c, on:t.id===S.activeType, fn:function(){ setActiveType(t.id); }}); });
  });
  it.push("-");
  it.push({t:"Poser des « "+cur.code+" » (un clic par réservation)",i:"stamp",fn:function(){ startObj(cur); }});
  it.push({t:"Dessiner une "+cur.code+" rectangulaire",i:"rect",k:"R",fn:function(){ setTool("rect"); }});
  it.push({t:"Dessiner une "+cur.code+" ronde",i:"circle",k:"C",fn:function(){ setTool("circle"); }});
  it.push("-");
  it.push({t:"Nouvel objet dans « "+(layerById(cur.ly)||{}).name+" »…",i:"plus",fn:function(){ newObjIn(layerById(cur.ly)); }});
  it.push({t:"Nouveau calque…",i:"layer",fn:newLayerUI});
  openMenu(b.left,b.bottom+4,it);
}
document.getElementById("objBtn").onclick=function(e){ e.stopPropagation(); objMenu(); };
/* « GT » → « GT n+1 », n = plus grand numéro déjà utilisé */
function typeName(code){
  var re=new RegExp("^"+escRe(code)+"\\s+(\\d+)$","i"), max=0;
  S.shapes.forEach(function(x){ var m=String(x.n).trim().match(re); if(m) max=Math.max(max,parseInt(m[1],10)); });
  return code+" "+(max+1);
}
/* changement de code : « GT 3 » devient « GTH 3 », les noms personnalisés ne bougent pas */
function renameType(t,old){
  if(!old||old===t.code) return 0;
  var re=new RegExp("^"+escRe(old)+"(\\s+\\d+)$","i"), n=0;
  S.shapes.forEach(function(s){ if(s.ty!==t.id) return; var m=String(s.n).trim().match(re); if(m){ s.n=t.code+m[1]; n++; } });
  return n;
}
function shown(sh){ return !sh.hid&&groupVis(sh); }
/* calque et objet affichés (la réservation peut être masquée à part) */
function groupVis(sh){ var l=layerOf(sh), t=typeOf(sh.ty); return (!l||l.vis!==false)&&(!t||t.vis!==false); }
/* sélection multiple : S.msel (Ctrl/Maj+clic, Ctrl+A) ; valable tant qu'elle contient la réservation courante */
function mselIds(){
  var m=(S.msel||[]).filter(function(id){ return S.shapes.some(function(s){ return s.id===id; }); });
  return m.length>1&&m.indexOf(S.selId)>=0? m : (S.selId&&sel()? [S.selId] : []);
}
function picked(id){ return mselIds().indexOf(id)>=0; }
function toggleSel(id){
  var m=mselIds().slice(), i=m.indexOf(id);
  if(i>=0){ m.splice(i,1); S.selId=m.length? m[m.length-1] : null; } else { m.push(id); S.selId=id; }
  S.msel=m; S.selM=null;
}
function selectAll(){
  var ids=S.shapes.filter(groupVis).map(function(s){ return s.id; });

/* ============ géométrie ============ */
/* calage d'un plan : 2 points en pixels + distance réelle → origine, rotation, échelle */
function ready(lv){ return !!(lv&&lv.scale&&lv.scale.s>0&&lv.org); }
function cal(lv){
  if(!ready(lv)) return {ax:0,ay:0,s:1,co:1,si:0,raw:true};
  var th=(lv.rot||0)*Math.PI/180;
  return {ax:lv.org.x,ay:lv.org.y,s:lv.scale.s,co:Math.cos(th),si:Math.sin(th),raw:false};
}
function scaleTxt(lv){
  if(!lv||!lv.scale) return "—";
  return lv.scale.ratio? "1/"+lv.scale.ratio : fmt(lv.scale.s,1)+" px/m";
}
/* reprise des anciens calages 2 points */
function migrate(l){
  if(l.cal && !l.scale){
    var c=l.cal, L=Math.hypot(c.bx-c.ax,c.by-c.ay);
    if(L&&c.d){ l.scale={s:L/c.d, ratio:(l.sc?l.sc.ratio:null), paper:(l.sc?l.sc.paper:null)};
      l.org={x:c.ax,y:c.ay}; l.rot=Math.atan2(c.by-c.ay,c.bx-c.ax)*180/Math.PI; }
    l.cal=null; l.sc=null;
  }
  return l;
}
function w2p(lv,X,Y){ var c=cal(lv); return {x:c.ax+c.s*(X*c.co-Y*c.si), y:c.ay+c.s*(X*c.si+Y*c.co)}; }
function p2w(lv,px,py){ var c=cal(lv),dx=(px-c.ax)/c.s,dy=(py-c.ay)/c.s;
  return {X:dx*c.co+dy*c.si, Y:-dx*c.si+dy*c.co}; }
/* applique une modification de calage sans faire bouger le plan à l'écran */
function keepView(lv,anchor,fn){
  var pre=cal(lv), w0=p2w(lv,anchor.x,anchor.y), s0=w2s(w0.X,w0.Y);
  fn();
  var post=cal(lv);
  if(pre.s>0&&post.s>0) S.view.s=S.view.s*(post.s/pre.s);
  var w1=p2w(lv,anchor.x,anchor.y), s1=w2s(w1.X,w1.Y);
  S.view.tx+=s0.x-s1.x; S.view.ty+=s0.y-s1.y;
}
function w2s(X,Y){ return {x:X*S.view.s+S.view.tx, y:Y*S.view.s+S.view.ty}; }
function s2w(x,y){ return {X:(x-S.view.tx)/S.view.s, Y:(y-S.view.ty)/S.view.s}; }
function rawPos(e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
/* en vue « Tous les niveaux », les coordonnées sont relatives à la tuile : celle du début du geste, sinon celle sous le pointeur */
function evPos(e){
  var p=rawPos(e); if(!tiled()) return p;
  var t=(ptrs.size&&ptTile)||tileAt(p)||tiles[0]; if(!t) return p;
  return {x:p.x-t.x, y:p.y-t.y};
}

/* échelle papier : px de l'image par mm de papier */
var PAPER={A4:[297,210],A3:[420,297],A2:[594,420],A1:[841,594],A0:[1189,841]};
function pxPerMm(lv,paper){
  if(!lv) return null;
  if(lv.pdf) return lv.pdf.base/(25.4/72);
  var P=PAPER[paper]; if(!P||!lv.w) return null;
  var land=lv.w>=lv.h;
  return lv.w/(land?P[0]:P[1]);
}

/* ============ persistance (IndexedDB) : plusieurs projets ============ */
/* clés : "projects" = liste des projets (nom, date, compteurs), "cur" = projet ouvert, "p:<id>" = contenu d'un projet.
   L'ancienne clé "project" (un seul projet) est reprise au premier démarrage, sans être effacée. */
var DBP=null;
function db(){ if(DBP) return DBP; DBP=new Promise(function(res,rej){
  try{ var r=indexedDB.open("resa-plans",1);
    r.onupgradeneeded=function(){ r.result.createObjectStore("kv"); };
    r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ DBP=null; rej(r.error); };
  }catch(err){ DBP=null; rej(err); } }); return DBP; }
function kvGet(k){ return db().then(function(d){ return new Promise(function(res){
    var r=d.transaction("kv","readonly").objectStore("kv").get(k);
    r.onsuccess=function(){ res(r.result===undefined?null:r.result); }; r.onerror=function(){ res(null); }; }); })
  .catch(function(){ return null; }); }
function kvPut(k,v){ return db().then(function(d){ return new Promise(function(res,rej){
    var t=d.transaction("kv","readwrite"); t.objectStore("kv").put(v,k);
    t.oncomplete=function(){ res(true); }; t.onerror=t.onabort=function(){ rej(t.error||new Error("écriture impossible")); }; }); }); }
function kvDel(k){ return db().then(function(d){ return new Promise(function(res){
    var t=d.transaction("kv","readwrite"); t.objectStore("kv").delete(k); t.oncomplete=function(){ res(true); }; t.onerror=function(){ res(false); }; }); })
  .catch(function(){ return false; }); }

var PID=null, PROJS=[];
function projMeta(id){ return PROJS.find(function(p){ return p.id===id; })||null; }
function pack(){ return { levels:S.levels.map(function(l){
    return {id:l.id,name:l.name,src:l.src,w:l.w,h:l.h,scale:l.scale,org:l.org,rot:l.rot,pdf:l.pdf,hf:l.hf}; }),
    shapes:S.shapes, activeId:S.activeId, seq:S.seq, demo:S.demo, asc:S.asc, title:S.title,
    layers:S.layers, activeLayer:S.activeLayer, types:S.types, activeType:S.activeType, items:S.items, meas:S.meas, activeItem:S.activeItem, ui:S.ui, expOff:S.expOff, multiOff:S.multiOff, zone:S.zone||null,
    hEt:S.hEt, zRef:S.zRef }; }
function counts(p){ return {nl:(p.levels||[]).length, nr:(p.shapes||[]).length, nm:(p.meas||[]).length}; }
var saveT=null, saveErr=false;
function persist(){

    .catch(function(){ if(!saveErr) note("Enregistrement impossible dans ce navigateur (mémoire pleine ou navigation privée ?) — exportez le projet en fichier.",7000); saveErr=true; });
}
/* chaque modification : enregistrement différé + étape d'annulation */
function save(){ clearTimeout(saveT); saveT=setTimeout(persist,400); histLater(); projLabel(); }

/* ============ annuler / rétablir ============ */
/* instantanés du projet sans les images ; les niveaux supprimés restent en mémoire pour pouvoir revenir */
var H={u:[],r:[],cur:null,t:null,lock:false}, lvPool={};
function snapState(){
  S.levels.forEach(function(l){ lvPool[l.id]=l; });
  function noOpen(a){ return (a||[]).map(function(x){ var c=Object.assign({},x); delete c.open; return c; }); }
  return JSON.stringify({lv:S.levels.map(function(l){ return {id:l.id,name:l.name,scale:l.scale,org:l.org,rot:l.rot,hf:l.hf}; }),
    shapes:S.shapes, layers:noOpen(S.layers), types:noOpen(S.types), items:noOpen(S.items), meas:S.meas,
    asc:S.asc, seq:S.seq, title:S.title, activeLayer:S.activeLayer, hEt:S.hEt, zRef:S.zRef});
}
function histReset(){ clearTimeout(H.t); H.u=[]; H.r=[]; H.cur=snapState(); updUndo(); }
function histLater(){ if(H.lock) return; clearTimeout(H.t); H.t=setTimeout(histCommit,300); }
function histCommit(){ clearTimeout(H.t); if(H.lock||H.cur===null) return; var n=snapState(); if(n===H.cur) return;
  H.u.push(H.cur); if(H.u.length>150) H.u.shift(); H.cur=n; H.r=[]; updUndo(); }
function updUndo(){ var u=document.getElementById("undoBtn"), r=document.getElementById("redoBtn");
  if(u) u.disabled=!H.u.length; if(r) r.disabled=!H.r.length; }
function restoreSnap(js){
  var o=JSON.parse(js), keep={};
  [S.layers,S.types||[],S.items].forEach(function(a){ a.forEach(function(x){ if(x.open!==undefined) keep[x.id]=x.open; }); });
  function reopen(a){ (a||[]).forEach(function(x){ if(keep[x.id]!==undefined) x.open=keep[x.id]; }); return a; }
  H.lock=true;
  S.levels=o.lv.map(function(x){ var l=lvPool[x.id]; if(!l) return null; l.name=x.name; l.scale=x.scale; l.org=x.org; l.rot=x.rot; l.hf=x.hf; return l; }).filter(Boolean);
  S.shapes=o.shapes; S.layers=reopen(o.layers); S.types=reopen(o.types); S.items=reopen(o.items||[]); S.meas=o.meas||[];
  S.asc=o.asc; S.seq=o.seq; S.title=o.title; S.activeLayer=o.activeLayer; S.hEt=o.hEt>0? o.hEt : 2.8; S.zRef=o.zRef||null;
  fixLayers(); fixItems();
  if(!S.levels.some(function(l){ return l.id===S.activeId; })) S.activeId=S.levels.length?S.levels[0].id:null;
  if(!sel()) S.selId=null; if(!selM()) S.selM=null;
  renderAll(); clearTimeout(saveT); saveT=setTimeout(persist,400); projLabel();
  H.lock=false;
}
function undo(){
  if(draft&&draft.pts.length){ draft.pts.pop(); if(!draft.pts.length) draft=null; draw(); draftHint(); return; }
  histCommit(); if(!H.u.length){ note("Rien à annuler."); return; }
  H.r.push(H.cur); H.cur=H.u.pop(); restoreSnap(H.cur); updUndo(); note("Annulé.",1400);
}
function redo(){
  histCommit(); if(!H.r.length){ note("Rien à rétablir."); return; }
  H.u.push(H.cur); H.cur=H.r.pop(); restoreSnap(H.cur); updUndo(); note("Rétabli.",1400);
}
document.getElementById("undoBtn").onclick=undo;
document.getElementById("redoBtn").onclick=redo;

/* ============ ouverture / création de projets ============ */
function blank(){
  S.levels=[]; S.shapes=[]; S.items=[]; S.meas=[]; S.layers=[]; S.types=undefined; S.activeType=null; S.activeLayer=null; S.activeItem=null;
  S.activeId=null; S.selId=null; S.selM=null; S.seq=1; S.asc=true; S.demo=false; S.under=""; S.title=""; S.expOff=[]; S.multiOff=[]; S.msel=[]; S.zone=null;
  S.hEt=2.8; S.zRef=null;
  resetViews(); meas=null; calLine=null; drag=null; draft=null; lvPool={};
  fixLayers(); fixItems();
}
function applyPack(p){
  blank(); if(!p) return Promise.resolve();
  S.title=p.title||""; S.levels=(p.levels||[]).map(migrate); S.shapes=p.shapes||[];
  S.activeId=p.activeId&&S.levels.some(function(l){ return l.id===p.activeId; })? p.activeId : (S.levels[0]&&S.levels[0].id)||null;
  S.seq=p.seq||(S.shapes.length+1); S.demo=!!p.demo; if(p.asc!==undefined) S.asc=p.asc;
  S.layers=p.layers||[]; S.activeLayer=p.activeLayer||null; S.types=p.types; S.activeType=p.activeType||null; S.items=p.items||[]; S.meas=p.meas||[]; S.activeItem=p.activeItem||null;
  S.hEt=p.hEt>0? +p.hEt : 2.8; S.zRef=p.zRef||null;
  S.levels.forEach(function(l){ if(!(l.hf>0)) delete l.hf; });
  S.expOff=Array.isArray(p.expOff)? p.expOff.filter(function(x){ return typeof x==="string"; }) : [];
  S.multiOff=Array.isArray(p.multiOff)? p.multiOff.filter(function(x){ return S.levels.some(function(l){ return l.id===x; }); }) : [];
  var z=p.zone; S.zone= z&&[z.x0,z.y0,z.x1,z.y1].every(isFinite)&&z.x1>z.x0&&z.y1>z.y0? {x0:z.x0,y0:z.y0,x1:z.x1,y1:z.y1} : null;
  fixLayers(); fixItems();
  if(!hasPrefs&&p.ui){ ["lv","ly","pr"].forEach(function(k){ if(typeof p.ui[k]==="boolean") S.ui[k]=p.ui[k]; }); if(p.ui.lst) S.ui.lst=p.ui.lst;
    if(p.ui.vp&&typeof p.ui.vp==="object") S.ui.vp=JSON.parse(JSON.stringify(p.ui.vp));
    if(p.ui.exp&&(PAPER_PT[p.ui.exp.fmt]||p.ui.exp.fmt==="orig")) S.ui.exp={fmt:p.ui.exp.fmt,ori:/^(auto|p|l)$/.test(p.ui.exp.ori)?p.ui.exp.ori:"auto",mode:p.ui.exp.mode==="res"?"res":"plans",ko:!!p.ui.exp.ko}; }
  return Promise.all(S.levels.map(loadImg));
}
function projLabel(){ var e=document.getElementById("projName"); if(e) e.textContent=S.title||(projMeta(PID)||{}).name||"Projet"; document.title=(S.title?S.title+" — ":"")+"Report & métré"; }
function afterOpen(){ closeMenu(); var na=document.querySelector(".hint.auto"); if(na) na.remove(); setTool("select"); setListView(S.ui.lst); layout(); fit(); histReset(); renderAll(); projLabel(); }
function openProject(id){
  return saveNow().then(function(){ return kvGet("p:"+id); }).then(function(p){
    PID=id; var m=projMeta(id); return applyPack(p||{title:m?m.name:""});
  }).then(function(){ if(!S.title){ var m=projMeta(id); if(m) S.title=m.name; } kvPut("cur",id).catch(function(){}); afterOpen(); });
}
function newProject(name,withDemo){
  return saveNow().then(function(){
    var id=uid(); PROJS.push({id:id,name:name||"Nouveau projet",upd:Date.now(),nl:0,nr:0,nm:0});
    PID=id; blank(); S.title=name||"Nouveau projet";
    if(withDemo) return demo(true);
  }).then(function(){ kvPut("cur",PID).catch(function(){}); afterOpen(); return persist(); });
}
/* démarrage : liste des projets, reprise de l'ancien projet unique, sinon projet d'exemple */
function boot(){
  return Promise.all([kvGet("projects"),kvGet("cur")]).then(function(r){
    PROJS=Array.isArray(r[0])? r[0] : [];
    if(PROJS.length) return openProject(PROJS.some(function(p){ return p.id===r[1]; })? r[1] : PROJS[0].id);
    return kvGet("project").then(function(old){
      if(old&&old.levels&&old.levels.length){
        var id=uid(); PROJS=[Object.assign({id:id,name:old.title||"Projet 1",upd:Date.now()},counts(old))];
        return kvPut("p:"+id,old).then(function(){ return kvPut("projects",PROJS); }).then(function(){ return openProject(id); })
          .catch(function(){ PID=id; return applyPack(old).then(afterOpen); });
      }
      return newProject("Exemple — 3 niveaux",true);
    });
  });

function loadImg(lv){ return new Promise(function(res){
  var i=new Image(); i.onload=function(){ lv.img=i; lv.w=i.naturalWidth; lv.h=i.naturalHeight; res(); };
  i.onerror=function(){ res(); }; i.src=lv.src; }); }

/* ============ import ============ */
document.getElementById("addBtn").onclick=function(){ document.getElementById("file").click(); };
document.getElementById("ordBtn").onclick=function(){ S.asc=!S.asc; renderAll(); save();
  note(S.asc?"Liste rangée du bas vers le haut (1er = niveau le plus bas).":"Liste rangée du haut vers le bas (1er = niveau le plus haut)."); };
function ordLabel(){ document.getElementById("ordBtn").textContent = S.asc? "↑ bas → haut" : "↓ haut → bas"; }

stage.addEventListener("dragover",function(e){ e.preventDefault(); });
stage.addEventListener("drop",function(e){ e.preventDefault();
  var f=Array.prototype.slice.call(e.dataTransfer.files); if(f.length) importFiles(f); });

function guessName(fn){
  var n=fn.replace(/\.[^.]+$/,"");
  var m=n.match(/\b(R\s*\+\s*\d+|RDC|R\.D\.C|SS\s*-?\s*\d+|S\.?SOL|COMBLES|TOITURE|TERRASSE|NIVEAU\s*-?\d+|N\s*-?\d+)\b/i);
  if(m) return m[0].toUpperCase().replace(/\s+/g,"").replace("R+","R+");
  return n.slice(0,34);
}
function importFiles(files){
  files.sort(function(a,b){ return a.name.localeCompare(b.name,"fr",{numeric:true}); });
  var jobs=files.map(function(f){ return fileToLevels(f); });
  Promise.all(jobs).then(function(groups){
    var added=[];
    groups.forEach(function(g){ g.forEach(function(l){ S.levels.push(l); added.push(l); }); });
    if(added.length){ if(!S.activeId) S.activeId=added[0].id; }
    return Promise.all(added.map(loadImg));
  }).then(function(){ if(S.demo){ S.demo=false; } fit(); renderAll(); save(); });
}
function fileToLevels(f){
  if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)) return pdfToLevels(f);
  return new Promise(function(res){
    var fr=new FileReader();
    fr.onload=function(){ res([{id:uid(),name:guessName(f.name),src:fr.result,cal:null}]); };
    fr.onerror=function(){ res([]); }; fr.readAsDataURL(f);
  });
}
function pdfToLevels(f){
  if(!window.pdfjsLib){ note("Lecture PDF indisponible — exportez le plan en PNG/JPG."); return Promise.resolve([]); }
  var bytes=null;
  return f.arrayBuffer().then(function(buf){
    bytes=new Uint8Array(buf);
    return pdfjsLib.getDocument({data:bytes.slice()}).promise;
  }).then(function(pdf){
    var out=[],chain=Promise.resolve();
    for(var p=1;p<=pdf.numPages;p++)(function(p){
      chain=chain.then(function(){ return pdf.getPage(p); }).then(function(page){
        var v1=page.getViewport({scale:1});
        var sc=Math.min(3400/v1.width, 3400/v1.height, 4);
        var v=page.getViewport({scale:sc});
        var c=document.createElement("canvas"); c.width=Math.round(v.width); c.height=Math.round(v.height);
        var g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height);
        return page.render({canvasContext:g,viewport:v}).promise.then(function(){
          out.push({id:uid(), name:(pdf.numPages>1? guessName(f.name)+" p."+p : guessName(f.name)),
                    src:c.toDataURL("image/jpeg",.92), cal:null,
                    pdf:{bytes:bytes, page:p, base:sc}});
        });
      });
    })(p);
    return chain.then(function(){ return out; });
  }).catch(function(){ note("PDF illisible — exportez le plan en PNG/JPG."); return []; });
}

/* ============ vues : une ou plusieurs vues sur la scène ============ */
/* dispositions : « 1 » vue simple ; « 2v », « 2h », « 3 », « 4 » : chaque vue montre le niveau de son choix ou l'élévation,
   liée (même zoom, même position que les autres) ou libre ; « all » : tous les niveaux choisis côte à côte, liés */
var tiles=[], ptTile=null, OFF={x:0,y:0}, drawT=null;
var GRID={"1":[1,1],"2v":[2,1],"2h":[1,2],"3":[3,1],"4":[2,2]}, PGAP=6, STATUS_H=24;
var V0=S.view, RK="0";                                  /* vue partagée par les vues liées ; clé du rendu fin en cours */
var PRT=[0,1,2,3].map(function(){ return {v:{s:0,tx:0,ty:0},sig:""}; });   /* vues libres et élévations */
function resetViews(){ V0={s:0,tx:0,ty:0}; S.view=V0; RK="0"; PRT.forEach(function(r){ r.v={s:0,tx:0,ty:0}; r.sig=""; }); }
function VP(){
  var v=S.ui.vp; if(!v||typeof v!=="object") v=S.ui.vp={};
  if(!GRID[v.lay]&&v.lay!=="all") v.lay=S.ui.multi? "all" : "1";
  if(!v.P||typeof v.P!=="object") v.P={};
  if(!(v.act>=0&&v.act<4)) v.act=0;
  if(v.ax!=="y") v.ax="x";
  if(!v.fr||typeof v.fr!=="object") v.fr={};
  return v;
}
function multiOn(){ var l=VP().lay; return l==="all"? S.levels.length>1 : l!=="1"; }
/* contenu des vues, mémorisé pour chaque disposition */
function panesOf(lay){ var vp=VP(); lay=lay||vp.lay; var a=vp.P[lay]; if(!Array.isArray(a)) a=vp.P[lay]=[];
  for(var i=0;i<4;i++) if(!a[i]||typeof a[i]!=="object") a[i]={c:null,link:true};
  return a; }
function tiled(){ return tiles.length>0; }
function upLevels(){ return S.asc? S.levels.slice() : S.levels.slice().reverse(); }   /* tous les niveaux, du bas vers le haut */
/* contenu des vues : un niveau existant ou « elev » ; à défaut, le niveau courant et ses voisins, et l'élévation */
function fixPanes(n){
  var vp=VP(), up=upLevels(), i0=Math.max(0,up.findIndex(function(l){ return l.id===S.activeId; }));
  function near(k){ var l=up[Math.min(up.length-1,Math.max(0,i0+k))]; return l? l.id : null; }

function endPtr(e){
  var tapPt=(drag&&drag.m==="tap")? evPos(e) : null;   /* avant de lâcher le pointeur : coordonnées dans la bonne tuile */
  ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
  if(!ptrs.size) setTimeout(function(){ if(!ptrs.size) ptTile=null; },0);
  if(!drag) return;
  if(drag.m==="cal"){ dockLine(true); drag=null; draw(); return; }
  if(drag.m==="dmove"){
    var sd=S.shapes.find(function(x){return x.id===drag.id;}), ld=active(), fresh=drag.fresh, mvd=drag.moved;
    drag=null; if(S.tool==="dev") setTool("select");
    if(sd&&ld&&devOf(sd,ld.id)){
      var ad=at(sd,ld.id), len=Math.hypot(centerOf(ad).X-centerOf(ad.devAt.start).X,centerOf(ad).Y-centerOf(ad.devAt.start).Y);
      if(len<.005){ delete sd.dev[ld.id]; if(!Object.keys(sd.dev).length) delete sd.dev;
        if(fresh||mvd) note(fresh? "Position inchangée : pas de dévoiement." : "Revenue au droit de "+lvName(ad.devAt.below)+" : dévoiement supprimé."); }
      else if(fresh) note("Dévoiement de "+mTxt(len)+" à partir de "+ld.name+" — ce n'est pas une anomalie. Choisissez le cheminement dans Propriétés, ou tirez le coude sur le plan.",6500);
    }
    renderAll(); if(fresh||mvd) save(); return;
  }
  if(drag.m==="rvtx"){
    var sv3=S.shapes.find(function(x){return x.id===drag.id;}), lv4=active(), mv4=drag.moved; drag=null;
    if(!mv4){ draw(); return; }
    if(sv3&&lv4){ var a4=at(sv3,lv4.id); if(a4.devAt) a4.devAt.d.pts=routeOf(a4).slice(1,-1); }   /* coudes confondus : fusionnés */
    renderAll(); save(); return;
  }
  if(drag.m==="real"){
    var sr=S.shapes.find(function(x){return x.id===drag.id;}), lr=active(), quiet=drag.quiet&&!drag.moved;
    drag=null; setTool("select");
    if(sr&&lr&&!quiet){ var ec2=ecart(at(sr,lr.id),obsOf(sr,lr.id)), up=heirs(sr,lr.id);
      note("Position réelle enregistrée — écart "+(ec2?Math.round(ec2.d*100):0)+" cm"+
        (up.length?" · correction reportée sur "+up.join(", "):"")+". Tirez les poignées rouges pour reprendre les dimensions.",6000); }
    renderAll(); save(); return;
  }
  if(drag.m==="rsize"){
    var sq=S.shapes.find(function(x){return x.id===drag.id;}), lq=active();
    drag=null;
    if(sq&&lq){ var oq=obsOf(sq,lq.id), aq=at(sq,lq.id); note("Dimensions réelles : "+dimTxt(realShape(aq,oq))+" (prévu "+dimTxt(aq)+")."); }
    renderAll(); save(); return;
  }
  if(drag.m==="tap"){ var lt=active(); drag=null; if(lt&&ptrs.size===0){ var pp=tapPt; if(S.tool==="count") addCount(lt,pp); else addDraftPt(lt,pp,false); } return; }
  if(drag.m==="arect"){ var la=active(), dr=drag; drag=null; if(la) addRect(la,dr.a,dr.b); draw(); return; }
  if(drag.m==="zone"){ var dz=drag; drag=null; setZone(dz.a,dz.b); return; }
  if(drag.m==="mvtx"||drag.m==="mmove"){ var mvd=drag.moved; drag=null; snapAt=null;
    if(mvd){ var mz=selM(); if(mz) mz.pts.forEach(function(pt){ pt.x=Math.round(pt.x*100)/100; pt.y=Math.round(pt.y*100)/100; }); renderAll(); save(); } else draw(); return; }
  if(drag.m==="draw"&&drag.prev){
    var s=drag.prev;
    var big = s.t==="rect" ? (s.w>.02&&s.h>.02) : s.r>.02;
    if(big){
      /* une réservation dessinée est un objet : celui choisi dans la barre d'outils, avec les cotes tracées */
      var to=typeOf(s.ty)||activeObj(), L=layerById(to.ly);
      s.id=uid(); s.ty=to.id; s.ly=to.ly; s.n=typeName(to.code); s.origin=S.activeId;
      s.levels=idsFrom(S.activeId,true); round(s); showObj(to);
      S.shapes.push(s); S.selId=s.id; S.msel=[]; setTool("select"); renderAll(); save();
      var nb=s.levels?s.levels.length:S.levels.length;
      note(s.n+" — objet « "+to.code+" », calque « "+(L?L.name:"")+" » — reportée sur "+nb+" niveau"+(nb>1?"x":"")+" : celui-ci et ceux du dessus.",3600);
    }
  }
  if(drag.m==="move"||drag.m==="size") save();
  if(drag.m==="pan"&&S.tool==="pan") cv.style.cursor="grab";
  if(drag.m==="pan") scheduleRefine();
  drag=null; draw();
}

  return base+" "+(max+1);

/* page de sortie d'un niveau ; k = points PDF par pixel de l'image de travail */
/* fond d'un niveau incorporé une seule fois dans le PDF de sortie : draw(page) le pose en coordonnées du niveau (Wd × Hd, origine en bas à gauche) */
function levelBase(out,l,cache){
  var L=window.PDFLib;
  if(l.pdf){
    return pdfPage(l).then(function(pg){
      var view=pg.view, rot=((pg.rotate||0)%360+360)%360, W=view[2]-view[0], H=view[3]-view[1];
      var src=cache.get(l.pdf.bytes);
      if(!src){ src=L.PDFDocument.load(l.pdf.bytes.slice(),{ignoreEncryption:true}); cache.set(l.pdf.bytes,src); }
      return src.then(function(doc){
        return out.embedPage(doc.getPage(l.pdf.page-1),{left:view[0],bottom:view[1],right:view[2],top:view[3]});
      }).then(function(emb){
        var Wd=rot%180===0?W:H, Hd=rot%180===0?H:W;
        var o= rot===90? {x:0,y:W,rotate:L.degrees(-90)} : rot===180? {x:W,y:H,rotate:L.degrees(180)} : rot===270? {x:H,y:0,rotate:L.degrees(90)} : {x:0,y:0};
        return {Wd:Wd,Hd:Hd,k:1/l.pdf.base,draw:function(page){ page.drawPage(emb,o); }};
      });
    });
  }
  var k=72/150, jpg=/^data:image\/jpe?g/i.test(l.src||""), data=l.src;
  if(!jpg&&!/^data:image\/png/i.test(l.src||"")){
    var c=document.createElement("canvas"); c.width=l.w; c.height=l.h; c.getContext("2d").drawImage(l.img,0,0); data=c.toDataURL("image/png");
  }
  return (jpg? out.embedJpg(data) : out.embedPng(data)).then(function(im){
    var Wd=l.w*k, Hd=l.h*k;
    return {Wd:Wd,Hd:Hd,k:k,draw:function(page){ page.drawImage(im,{x:0,y:0,width:Wd,height:Hd}); }};
  });
}
function levelPage(out,l,cache){
  var L=window.PDFLib;
  if(l.pdf){
    return pdfPage(l).then(function(pg){
      var view=pg.view, rot=((pg.rotate||0)%360+360)%360, W=view[2]-view[0], H=view[3]-view[1];
      var src=cache.get(l.pdf.bytes);
      if(!src){ src=L.PDFDocument.load(l.pdf.bytes.slice(),{ignoreEncryption:true}); cache.set(l.pdf.bytes,src); }
      return src.then(function(doc){
        return out.embedPage(doc.getPage(l.pdf.page-1),{left:view[0],bottom:view[1],right:view[2],top:view[3]});
      }).then(function(emb){
        var Wd=rot%180===0?W:H, Hd=rot%180===0?H:W, page=out.addPage([Wd,Hd]);
        /* /Rotate du PDF source : la page est redressée pour que les annotations restent droites */
        var o= rot===90? {x:0,y:W,rotate:L.degrees(-90)} : rot===180? {x:W,y:H,rotate:L.degrees(180)} : rot===270? {x:H,y:0,rotate:L.degrees(90)} : {x:0,y:0};
        page.drawPage(emb,o);
        return {page:page,Wd:Wd,Hd:Hd,k:1/l.pdf.base};
      });
    });
  }
  var k=72/150, jpg=/^data:image\/jpe?g/i.test(l.src||""), data=l.src;
  if(!jpg&&!/^data:image\/png/i.test(l.src||"")){
    var c=document.createElement("canvas"); c.width=l.w; c.height=l.h; c.getContext("2d").drawImage(l.img,0,0); data=c.toDataURL("image/png");
  }
  return (jpg? out.embedJpg(data) : out.embedPng(data)).then(function(im){
    var Wd=l.w*k, Hd=l.h*k, page=out.addPage([Wd,Hd]);
    page.drawImage(im,{x:0,y:0,width:Wd,height:Hd});
    return {page:page,Wd:Wd,Hd:Hd,k:k};
  });

/* tailles des lignes du cartouche, en multiples de Tz ; sert aussi à calculer la hauteur du bandeau */
var HEAD_S=[1.3,.8,.8,.85,.72,.72];

function annotate(info,l,rows,F,title,Tz,scaleLine,opt){

  function col(hex){ var c=hexRGB(hex); return L.rgb(c[0]/255,c[1]/255,c[2]/255); }
  function td(X,Y){ var p=w2p(l,X,Y); return {x:p.x*k, y:p.y*k}; }         /* haut → bas */
  function bu(X,Y){ var p=td(X,Y); return {x:p.x, y:Hd-p.y}; }             /* bas → haut (pdf-lib) */
  function shape(s,o){
    if(s.t==="rect"){
      var p=corners(s).map(function(q){ return td(q[0],q[1]); });
      page.drawSvgPath("M "+p.map(function(q){ return q.x.toFixed(2)+" "+q.y.toFixed(2); }).join(" L ")+" Z",
        {x:0,y:Hd,color:o.fill,opacity:o.op,borderColor:o.color,borderWidth:o.width,borderOpacity:1,borderDashArray:o.dash});
    }else{
      var c=bu(s.x,s.y);
      page.drawCircle({x:c.x,y:c.y,size:Math.max(s.r*ppm,.8),color:o.fill,opacity:o.op,borderColor:o.color,borderWidth:o.width,borderOpacity:1,borderDashArray:o.dash});
    }
  }
  function arrow(a,b,color,w){
    var len=Math.hypot(b.x-a.x,b.y-a.y); if(len<w*2) return;
    page.drawLine({start:a,end:b,thickness:w,color:color});
    var an=Math.atan2(b.y-a.y,b.x-a.x), s=Math.min(Tz*.7,len/2.5);

  }
  function overlap(a,b){ return a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h; }
  function wrap(t,font,size,maxW){

    page.drawLine({start:from,end:to,thickness:lw*.7,color:RED});

    {t:win([title,today()].filter(Boolean).join("  ·  ")),s:Tz*HEAD_S[1],c:GREY},
    {t:win(scaleLine),b:1,s:Tz*HEAD_S[2]},
    {t:win(rows.length+" réservation(s)  ·  "+kos+" anomalie(s)"+(devs?"  ·  "+devs+" dévoiement(s)":"")),b:1,s:Tz*HEAD_S[3],c:kos?RED:L.rgb(0,0,0)},
    {t:win("Trait plein : position attendue  ·  Pointillé rouge : position réelle"+(devs?"  ·  Trait épais fléché : dévoiement prévu (pas une anomalie)":"")),s:Tz*HEAD_S[4],c:GREY},
    {t:win("Écart X + vers la droite, Y + vers le bas du plan"),s:Tz*HEAD_S[5],c:GREY}];

    var b=place(w,h,m.x,m.y,1,1,Tz*.5);
    page.drawRectangle({x:b.x,y:b.y,width:b.w,height:b.h,color:WHITE,opacity:.88,borderColor:c,borderWidth:lw*.6});
    page.drawText(t,{x:b.x+pad/2,y:b.y+sz*.38,size:sz,font:F.b,color:c});
  });
  /* noms des réservations conformes ou non contrôlées */
  rows.forEach(function(r){
    if(r.ko) return;
    var s=r.sh, tl=bu(s.t==="rect"?s.x:s.x-s.r, s.t==="rect"?s.y:s.y-s.r);
    var t=win(s.n+(s.devAt?" (dévoyée)":s.from?(s.fromDev?" (dévoiement de ":" (repris de ")+lvName(s.from)+")":"")), sz=Tz*.7, w=F.b.widthOfTextAtSize(t,sz)+pad, h=sz*1.3;
    var b={x:Math.min(Math.max(BX+BM,tl.x),BW-w-BM), y:Math.min(tl.y+lw,BH-h-BM), w:w, h:h};
    page.drawRectangle({x:b.x,y:b.y,width:b.w,height:b.h,color:WHITE,opacity:.8});
    page.drawText(t,{x:b.x+pad/2,y:b.y+sz*.3,size:sz,font:F.b,color:col(colOf(r.orig))});
    boxes.push(b);
  });

  rows.forEach(function(r){
    if(!r.ko) return;

    if(ec) lines.push({t:win("X "+cm(ec.dx)+"   ·   Y "+cm(ec.dy)),b:1,s:Tz*.85,c:RED});
    else lines.push({t:win("position réelle non pointée"),s:Tz*.8,c:RED});
    if(rs&&dimsChanged(s,o)) lines.push({t:win("réel "+dimTxt(rs)+"  (prévu "+dimTxt(s)+")"),s:Tz*.8});
    if(o.c) wrap(o.c,F.r,Tz*.8,Tz*24).slice(0,3).forEach(function(t){ lines.push({t:t,s:Tz*.8}); });
    if(s.devAt) lines.push({t:win("position prévue : dévoiement sur ce niveau"),s:Tz*.72,c:GREY});
    else if(s.from) lines.push({t:win((s.fromDev?"position du dévoiement de ":"position attendue reprise de ")+lvName(s.from)),s:Tz*.72,c:GREY});

}

/* formats ISO portrait, en points */
var PAPER_PT={a0:[2384,3370],a1:[1684,2384],a2:[1191,1684],a3:[842,1191],a4:[595,842]};
var EXP_MARGIN=8*72/25.4, PRINT_PT=9;
function paperFor(fmt,ori,W,H){
  if(fmt==="orig"||!PAPER_PT[fmt]) return null;
  var p=PAPER_PT[fmt], land= ori==="l" || (ori!=="p" && W>H);
  return {w:land?p[1]:p[0], h:land?p[0]:p[1], name:fmt.toUpperCase()+(land?" paysage":" portrait")};
}
function fitIn(t,W,H){ return Math.min((t.w-2*EXP_MARGIN)/W,(t.h-2*EXP_MARGIN)/H); }
/* taille de la page d'un niveau en points, avant export (le PDF garde sa rotation dans l'image de travail) */
function levelPt(l){ var k=l.pdf? 1/l.pdf.base : 72/150; return {W:l.w*k, H:l.h*k, k:k}; }
/* mise en page d'un niveau : échelle f de la page annotée sur la feuille, taille de texte, échelle imprimée */
function layoutFor(l,W,H,k,fmt,ori){
  var t0=paperFor(fmt,ori,W,H), f0=t0? fitIn(t0,W,H) : 1, Tz=PRINT_PT/f0, Ha=H+bandH(Tz);
  var t=paperFor(fmt,ori,W,Ha), f=t? fitIn(t,W,Ha) : 1;
  var N=1000/(cal(l).s*k*f*25.4/72);
  return {paper:t, f:f, Tz:Tz, Ha:Ha, N:N};
}
function ratioTxt(N){
  var std=[10,20,25,50,75,100,125,150,200,250,500,1000];
  for(var i=0;i<std.length;i++) if(Math.abs(N-std[i])/std[i]<.02) return "1/"+std[i];
  return "≈ 1/"+Math.round(N);
}
function exportPlans(fmt,ori,prog,withMt,pick){
  var L=window.PDFLib;
  if(!L) return Promise.reject(new Error("module PDF non chargé"));
  var lvs=levelsUp(); if(!lvs.length) return Promise.reject(new Error("aucun niveau calé (échelle + repère)"));
  var tmp, F={}, cache=new Map(), title=S.title||"", lays=[];
  var chain=L.PDFDocument.create().then(function(d){ tmp=d;
    return Promise.all([tmp.embedFont(L.StandardFonts.Helvetica),tmp.embedFont(L.StandardFonts.HelveticaBold)]); })
    .then(function(f){ F.r=f[0]; F.b=f[1]; });
  lvs.forEach(function(l,i){ chain=chain.then(function(){
    prog("Plan "+(i+1)+" / "+lvs.length+" — "+l.name+"…");
    return levelPage(tmp,l,cache).then(function(info){
      var ly=layoutFor(l,info.Wd,info.Hd,info.k,fmt,ori);
      if(withMt) drawMetrePdf(info,l,F,ly.Tz);
      annotate(info,l,exportRows(l,pick),F,title,ly.Tz,
        "Échelle à l'impression : "+ratioTxt(ly.N)+" — "+(ly.paper?ly.paper.name:"format d'origine")+", imprimer à 100 % (taille réelle)");
      if(withMt) metreLegendPdf(info,l,F,ly.Tz);
      lays.push({ly:ly, W:info.Wd});
    });
  }); });
  /* format choisi : chaque page annotée est posée, toujours en vectoriel, à l'échelle de la feuille */
  chain=chain.then(function(){
    if(fmt==="orig") return tmp;
    /* pdf-lib n'écrit les pages incorporées qu'à l'enregistrement : on finalise avant de les reposer */
    var done;

      var c=Promise.resolve();

          pg.drawPage(emb,{x:(t.w-w)/2, y:(t.h-h)/2, width:w, height:h});

/* ============ export réservation par réservation : une page par réservation, ses niveaux zoomés côte à côte ============ */
var STD_N=[5,10,20,25,50,75,100,125,150,200,250,500,1000,2000];
function resList(pick){
  return S.shapes.filter(shown).filter(function(sh){ return !pick||pick.has(sh.id); }).map(function(sh){
    var lvs=levelsUp().filter(function(l){ return onLevel(sh,l.id); });
    return {sh:sh, lvs:lvs, kos:lvs.filter(function(l){ var o=obsOf(sh,l.id); return o&&o.st==="ko"; }).length};
  }).filter(function(r){ return r.lvs.length; })
    .sort(function(a,b){ return String(a.sh.n||"").localeCompare(String(b.sh.n||""),"fr",{numeric:true}); });
}
/* emprise de la réservation sur un niveau (attendue, réelle, projet d'origine), en points du niveau, bas → haut */
function resBox(sh,l,base){
  var k=base.k, xs=[], ys=[], sa=at(sh,l.id), o=obsOf(sh,l.id), list=[sa];
  if(sa.des) list.push(sa.des);
  if(sa.devAt) list.push(sa.devAt.start);
  if(o&&o.st==="ko"&&o.real) list.push(realShape(sa,o));
  function add(X,Y){ var p=w2p(l,X,Y); xs.push(p.x*k); ys.push(base.Hd-p.y*k); }
  list.forEach(function(s){ corners(s).forEach(function(q){ add(q[0],q[1]); }); });
  routeOf(sa).forEach(function(q){ add(q.X,q.Y); });
  var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs), y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  return {cx:(x0+x1)/2, cy:(y0+y1)/2, w:x1-x0, h:y1-y0};
}
var RES_HEAD=62, RES_CAP=26, RES_GAP=10;
/* grille des vues sur la feuille : nombre de colonnes et échelle (pt de papier par mètre) donnant le plus grand zoom */
function resGrid(t,n,needW,needH){
  var aw=t.w-2*EXP_MARGIN, ah=t.h-2*EXP_MARGIN-RES_HEAD, best=null;
  for(var c=1;c<=n;c++){
    var r=Math.ceil(n/c), pw=(aw-(c-1)*RES_GAP)/c, ph=(ah-r*RES_CAP-(r-1)*RES_GAP)/r;
    if(pw<=0||ph<=0) continue;
    var s=Math.min(pw/needW,ph/needH);
    if(!best||s>best.s) best={c:c,r:r,pw:pw,ph:ph,s:s};
  }
  /* échelle ronde (1/20, 1/50…) juste en dessous du zoom maximal */
  var Nmin=72000/(25.4*best.s), N=STD_N.find(function(v){ return v>=Nmin*.999; })||Math.ceil(Nmin);
  best.N=N; best.s=72000/(25.4*N);
  return best;
}
/* withElev : colonne de droite avec l'élévation X et Y de la réservation */
function exportByRes(fmt,ori,pick,prog,withElev){
  var L=window.PDFLib;
  if(!L) return Promise.reject(new Error("module PDF non chargé"));
  if(!levelsUp().length) return Promise.reject(new Error("aucun niveau calé (échelle + repère)"));
  var list=resList(pick);
  if(!list.length) return Promise.reject(new Error("aucune des réservations cochées n'est sur un niveau calé"));
  if(!PAPER_PT[fmt]) fmt="a3";
  var out, F={}, cache=new Map(), bases=new Map(), title=S.title||"";

  function base(l){ if(!bases.has(l.id)) bases.set(l.id,levelBase(out,l,cache)); return bases.get(l.id); }

      page.drawText(win((ri+1)+" / "+list.length),{x:t.w-M-F.r.widthOfTextAtSize(win((ri+1)+" / "+list.length),9),y:top-12,size:9,font:F.r,color:GREY});
      var l2=[sh.t==="rect"?"Rectangulaire":"Ronde",dimTxt(sh),ty?"objet "+ty.code:"",ly?"calque "+ly.name:"",
        lvs.length+" niveau"+(lvs.length>1?"x":"")+" : "+lvs.map(function(l){ return l.name; }).join(", "),
        it.kos?it.kos+" anomalie"+(it.kos>1?"s":""):"aucune anomalie"].filter(Boolean).join("  ·  ");
      page.drawText(fitTxt(l2,F.b,9,t.w-2*M),{x:M,y:top-29,size:9,font:F.b,color:it.kos?RED:BLACK});
      page.drawText(fitTxt([title,today(),"Échelle à l'impression : "+ratioTxt(g.N)+" — "+t.name+", imprimer à 100 % (taille réelle)"].filter(Boolean).join("  ·  "),F.r,8.5,t.w-2*M),
        {x:M,y:top-42,size:8.5,font:F.r,color:BLACK});
      page.drawText(win("Seule cette réservation est affichée  ·  Trait plein : position attendue  ·  Pointillé rouge : position réelle  ·  Écart X + vers la droite, Y + vers le bas du plan"),
        {x:M,y:top-54,size:7.5,font:F.r,color:GREY});
      /* une vue par niveau, de gauche à droite du bas vers le haut du bâtiment */
      lvs.forEach(function(l,i){

        var cw=g.pw/f, ch=g.ph/f, wx=bx.cx-cw/2, wy=bx.cy-ch/2;

/* ============ élévation schématique : les niveaux empilés à leur hauteur, les réseaux qui les traversent ============ */

  return up.find(function(l){ return l.id===S.zRef; })||up.find(function(l){ return /^\s*(rdc|r\.d\.c|rez)/i.test(l.name); })||up[0]||null; }
/* altitude de chaque niveau, le niveau de référence à ±0,00 */
function alts(){

function heightsTxt(){ var Z=alts(); return upLevels().slice().reverse().map(function(l){ return esc(l.name)+" "+altTxt(Z[l.id]); }).join(" · "); }

    '<div style="display:flex;gap:8px;align-items:flex-end"><div class="fld" style="flex:1"><label>Hauteur par défaut (m)</label><input type="number" id="h_def" step="0.01" min="0.5" value="'+(S.hEt||2.8).toFixed(2)+'"></div>'+
    '<button class="btn" id="h_all" title="Mettre la hauteur par défaut entre tous les niveaux">Appliquer à tous</button></div>'+
    '<div class="hts" id="h_list"></div>'+

/* réservations montrées dans la vue Élévation : la sélection multiple, sinon celles de la zone tracée, sinon toutes les visibles */
function elevSet(){
  var ms=mselIds();
  if(ms.length>1){ var l=S.shapes.filter(function(s){ return ms.indexOf(s.id)>=0&&shown(s); }); return {list:l, why:plural(l.length,"sélectionnée","sélectionnées")}; }
  var all=S.shapes.filter(shown);

    return {list:l2, why:"zone · "+plural(l2.length,"réservation")}; }
  return {list:all, why:plural(all.length,"réservation")};
}
/* modèle de l'élévation, en mètres : u = abscisse (X ou Y du repère), z = altitude */
function elevModel(list,axis){
  var up=upLevels(), Z=alts(), y=axis==="y";
  var lvs=up.map(function(l){ return {l:l, z:Z[l.id], ok:ready(l)}; });
  function ext(g){ return g.t==="rect"? (y?[g.y,g.y+g.h]:[g.x,g.x+g.w]) : (y?[g.y-g.r,g.y+g.r]:[g.x-g.r,g.x+g.r]); }

  var items=[];
  list.forEach(function(sh){
    var P=[];
    lvs.forEach(function(L){
      if(!L.ok||!onLevel(sh,L.l.id)) return;
      var a=at(sh,L.l.id), o=obsOf(sh,L.l.id), ko=!!(o&&o.st==="ko"), rs=ko&&o.real? realShape(a,o) : null;
      var p={l:L.l, z:L.z, e:ext(a), r:rs?ext(rs):null, ko:ko, ok:!!(o&&o.st==="ok")};
      p.ce=mid(p.e); p.c=p.r? mid(p.r) : p.ce;
      if(rs){ var ec=ecart(a,o); p.ec=ec.d; p.ecu=y?ec.dy:ec.dx; }
      if(a.devAt){ var rt=routeOf(a); p.dev=rt.map(function(q){ return y?q.Y:q.X; }); p.devLen=routeLen(rt); }
      grow(p.e[0]); grow(p.e[1]); if(p.r){ grow(p.r[0]); grow(p.r[1]); } if(p.dev) p.dev.forEach(grow);
      P.push(p);
    });
    if(P.length) items.push({sh:sh, col:colOf(sh), P:P, segs:elevSegs(P)});
  });

  if(u1-u0<4){ var c=(u0+u1)/2; u0=c-2; u1=c+2; }

/* tracé du réseau d'une réservation, du bas vers le haut : traits verticaux, dévoiement prévu en plafond (« dev »),

function elevSegs(P){

  for(var i=1;i<n;i++){
    var a=P[i-1], b=P[i], zj=b.z-SLAB-JOG, x=a.c;
    out.push({k:"net",p:[[x,a.z],[x,zj]]});
    if(b.dev&&b.dev.length>1){
      var r=b.dev;
      if(Math.abs(r[0]-x)>.005) out.push({k:"off",p:[[x,zj],[r[0],zj]]});
      out.push({k:"dev",p:r.map(function(u){ return [u,zj]; }),len:b.devLen,lv:b.l}); x=r[r.length-1];
    }else if(Math.abs(b.ce-x)>.005){ out.push({k:"off",p:[[x,zj],[b.ce,zj]]}); x=b.ce; }
    if(b.r&&Math.abs(b.c-x)>.005){ out.push({k:"off",p:[[x,zj],[b.c,zj]]}); x=b.c; }
    out.push({k:"net",p:[[x,zj],[x,b.z]]});
